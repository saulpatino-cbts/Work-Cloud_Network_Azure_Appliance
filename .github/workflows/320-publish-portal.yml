# CD: Publish portal workflow
# Triggered manually (workflow_dispatch).
# Runs `cna publish run` inside the CNA container against a specified engagement.
#
# Required repository secrets:
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID — same as all other workflows
#
# Design:
#   - Uses OIDC (no long-lived keys stored as secrets)
#   - Engagement data is never checked into the repo
#     (engagements/ is in .gitignore)
#   - Runs in the same container image used locally for reproducibility
name: "320 · Publish Delivery Portal"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Client environment owning the portal storage account'
        required: true
        type: choice
        options:
          - dev
          - prod
      engagement_id:
        description: 'Engagement ID (e.g. acme-20260305-a3f2)'
        required: true
        type: string
      image_tag:
        description: 'CNA image tag to use (default: latest)'
        required: false
        default: 'latest'
        type: string
      engagement_artifact:
        description: 'Optional GitHub Actions artifact name containing the engagements/ content'
        required: false
        default: ''
        type: string
      azure_storage_account:
        description: 'Azure Blob storage account name'
        required: true
        default: ''
        type: string
      azure_container:
        description: 'Azure Blob container name (defaults to engagement_id)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write   # OIDC

# One publish per engagement at a time — overlapping runs would race to write
# the same portal output; a newer dispatch supersedes an in-flight one.
concurrency:
  group: azure-environment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish — ${{ inputs.engagement_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment == 'prod' && 'hub' || inputs.environment }}
    env:
      REGISTRY: docker.io
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      IMAGE_REPOSITORY: cna
      ENVIRONMENT: ${{ inputs.environment }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      RUNNER_STORAGE_ACCOUNT: ${{ inputs.azure_storage_account }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      - name: Download engagement artifact
        if: inputs.engagement_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.engagement_artifact }}
          path: ${{ github.workspace }}/engagements

      # Azure OIDC — uses same AZURE_* secrets as all other workflows
      - name: Validate client portal scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: bash scripts/ci/validate_client_config.sh teardown

      - name: Configure Azure credentials (OIDC)
        id: azure_login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile and journal portal storage window
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
        run: bash scripts/ci/runner_firewall_window.sh prepare

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull CNA image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker pull "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:$IMAGE_TAG"

      - name: Validate publish inputs
        env:
          CLOUD: azure
          STORAGE_ACCOUNT: ${{ inputs.azure_storage_account }}
          ENGAGEMENT_ID: ${{ inputs.engagement_id }}
        run: |
          if [ ! -d "${{ github.workspace }}/engagements/$ENGAGEMENT_ID" ]; then
            echo "::error::Expected engagement content under ${{ github.workspace }}/engagements/$ENGAGEMENT_ID."
            echo "::error::Provide the files in the runner workspace or set engagement_artifact to a previously uploaded artifact."
            exit 1
          fi

          if [ -z "$STORAGE_ACCOUNT" ]; then
            echo "::error::azure_storage_account is required."
            exit 1
          fi

      # A delivery-portal account created by this appliance's storage module is
      # deny-by-default, so allow this runner's public IP for the upload and
      # remove it again afterwards (harmless on an account that allows all).
      - name: Ensure storage account is reachable from this runner
        env:
          AZURE_STORAGE_ACCOUNT: ${{ inputs.azure_storage_account }}
        run: |
          STORAGE_ACCOUNT_RG=$(az storage account show --name "$AZURE_STORAGE_ACCOUNT" --query resourceGroup -o tsv --only-show-errors)
          echo "STORAGE_ACCOUNT_RG=$STORAGE_ACCOUNT_RG" >> "$GITHUB_ENV"
          RUNNER_IP="${RUNNER_FIREWALL_IP:?Journaled runner IP required}"
          az storage account network-rule add --account-name "$AZURE_STORAGE_ACCOUNT" --resource-group "$STORAGE_ACCOUNT_RG" --ip-address "$RUNNER_IP" --only-show-errors > /dev/null
          # Firewall rule propagation is not immediate — wait until the data
          # plane accepts this runner before publishing.
          for i in $(seq 1 18); do
            if az storage container list --account-name "$AZURE_STORAGE_ACCOUNT" --auth-mode key --num-results 1 --only-show-errors -o none 2>/dev/null; then
              echo "Storage data plane reachable from runner."
              break
            fi
            if [ "$i" = "18" ]; then
              echo "::warning::Storage account $AZURE_STORAGE_ACCOUNT data plane still unreachable after ~3 minutes."
            else
              sleep 10
            fi
          done

      - name: Run cna publish
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENGAGEMENT_ID: ${{ inputs.engagement_id }}
          CLOUD: azure
          AZURE_STORAGE_ACCOUNT: ${{ inputs.azure_storage_account }}
          AZURE_CONTAINER: ${{ inputs.azure_container }}
        run: |
          set -euo pipefail

          ARGS=(publish run --engagement-id "$ENGAGEMENT_ID" --cloud "$CLOUD" --ttl-hours 168)
          ARGS+=(--storage-account "$AZURE_STORAGE_ACCOUNT")
          if [ -n "$AZURE_CONTAINER" ]; then
            ARGS+=(--container "$AZURE_CONTAINER")
          fi

          docker run --rm \
            -e AZURE_CLIENT_ID -e AZURE_TENANT_ID -e AZURE_SUBSCRIPTION_ID \
            -v "${{ github.workspace }}/engagements:/app/engagements:ro" \
            "${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:$IMAGE_TAG" \
            "${ARGS[@]}"

      - name: Remove Runner IP from storage account
        if: always() && steps.azure_login.outcome == 'success'
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
        run: bash scripts/ci/runner_firewall_window.sh cleanup
