name: "000 · Bootstrap Backend"
# First application bootstrap workflow. Run this before any Terraform-backed
# deploy in the target subscription.
# Creates the workload RG, provisions the Terraform remote backend in a
# separate tfstate RG that follows the same naming convention, and imports the
# workload RG into the selected environment state. The setup script writes the
# TFSTATE_* GitHub Variables ahead of time; this workflow confirms them.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment state to initialize
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      location:
        description: "Azure region for the workload resource group and tfstate backend, e.g. eastus (no default on purpose; see https://learn.microsoft.com/azure/reliability/regions-list)"
        required: true
        default: ""
        type: string
      region_short:
        description: "Short lowercase code for your region used in resource names, e.g. eus for eastus (no default on purpose)"
        required: true
        default: ""
        type: string
      tfstate_resource_group:
        description: Terraform state resource group name (default rg-cna-<environment>-<region_short>-tfstate)
        required: false
        default: ""
        type: string
      tfstate_storage_account:
        description: Storage account name for Terraform state (globally unique, 3-24 chars, lowercase)
        required: true
        default: stcnatfstate0001
        type: string
      tfstate_container:
        description: Blob container name for state files
        required: true
        default: tfstate
        type: string

permissions:
  id-token: write
  contents: read

# Bootstrap creates shared backend state — never let two runs race to create the
# same RG / storage account / container. Serialize by environment and do not
# cancel an in-flight run (a half-created backend is worse than a queued one).
concurrency:
  group: bootstrap-backend-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Bind dispatch inputs to env so no run: block interpolates ${{ inputs.* }}
      # into shell (DEVOPS-005); steps reference the shell variables below.
      ENVIRONMENT: ${{ inputs.environment }}
      REGION_SHORT: ${{ inputs.region_short }}
      INPUT_TFSTATE_RESOURCE_GROUP: ${{ inputs.tfstate_resource_group }}
      LOCATION: ${{ inputs.location }}
      TFSTATE_STORAGE_ACCOUNT: ${{ inputs.tfstate_storage_account }}
      TFSTATE_CONTAINER: ${{ inputs.tfstate_container }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Azure subscription context
        run: |
          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --only-show-errors

      - name: Validate PostgreSQL password is set
        env:
          PG_PASSWORD: ${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}
        run: |
          if [ -z "$PG_PASSWORD" ]; then
            echo "::error::CNA_POSTGRES_ADMIN_PASSWORD secret is not set."
            exit 1
          fi
          if echo "$PG_PASSWORD" | grep -qP '[@:/?#%\[\]]'; then
            echo "::notice::CNA_POSTGRES_ADMIN_PASSWORD contains URL-special characters -- they will be percent-encoded by Terraform urlencode() in the connection string."
          fi
          echo "Password: OK"

      - name: Resolve bootstrap targets
        run: |
          # region_short must match the SAME contract the Terraform variable
          # enforces (^[a-z0-9]{2,8}$). Validating it here means an invalid value
          # (e.g. "scus-1" or "SCUS") fails now, before any resource group or
          # state backend is created, instead of surviving bootstrap and failing
          # a later plan.
          if ! printf '%s' "$REGION_SHORT" | grep -Eq '^[a-z0-9]{2,8}$'; then
            echo "::error::Input region_short must be 2-8 lowercase letters/digits (e.g. eus) to match the Terraform contract. Got: '$REGION_SHORT'."
            exit 1
          fi
          # location: Azure region ids are lowercase letters/digits (e.g. eastus).
          if ! printf '%s' "$LOCATION" | grep -Eq '^[a-z0-9]+$'; then
            echo "::error::Input location must be a valid Azure region id of lowercase letters/digits (e.g. eastus). Got: '$LOCATION'."
            exit 1
          fi
          WORKLOAD_RG="rg-cna-${ENVIRONMENT}-${REGION_SHORT}"
          TFSTATE_RG="${INPUT_TFSTATE_RESOURCE_GROUP}"
          if [[ -z "$TFSTATE_RG" ]]; then
            TFSTATE_RG="${WORKLOAD_RG}-tfstate"
          fi
          echo "WORKLOAD_RG=$WORKLOAD_RG" >> "$GITHUB_ENV"
          echo "TFSTATE_RG=$TFSTATE_RG" >> "$GITHUB_ENV"
          echo "TFSTATE_KEY=${ENVIRONMENT}.terraform.tfstate" >> "$GITHUB_ENV"

      - name: Verify target subscription
        env:
          VAR_TARGET_SUBSCRIPTION_NAME: ${{ vars.AZURE_TARGET_SUBSCRIPTION_NAME }}
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          SUB_NAME=$(az account show --query name -o tsv)
          EXPECTED_SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          EXPECTED_SUB_NAME="$VAR_TARGET_SUBSCRIPTION_NAME"

          if [[ -n "$EXPECTED_SUB_ID" && "$EXPECTED_SUB_ID" != "none" && "$EXPECTED_SUB_ID" != "$SUB_ID" ]]; then
            echo "::error::Authenticated to subscription $SUB_ID, but AZURE_SUBSCRIPTION_ID expects $EXPECTED_SUB_ID"
            exit 1
          fi

          if [[ -n "$EXPECTED_SUB_NAME" && "$EXPECTED_SUB_NAME" != "none" && "$EXPECTED_SUB_NAME" != "$SUB_NAME" ]]; then
            echo "::error::Authenticated to subscription '$SUB_NAME', but AZURE_TARGET_SUBSCRIPTION_NAME expects '$EXPECTED_SUB_NAME'"
            exit 1
          fi

      - name: Create workload resource group
        run: |
          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --only-show-errors

          EXISTS=$(az group exists \
            --name "$WORKLOAD_RG" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --output tsv)

          if [[ "$EXISTS" == "true" ]]; then
            echo "Workload resource group '$WORKLOAD_RG' already exists; skipping creation."
          else
            az group create \
              --name "$WORKLOAD_RG" \
              --location "${LOCATION}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Create tfstate resource group
        run: |
          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --only-show-errors

          EXISTS=$(az group exists \
            --name "$TFSTATE_RG" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --output tsv)

          if [[ "$EXISTS" == "true" ]]; then
            echo "TF state resource group '$TFSTATE_RG' already exists; skipping creation."
          else
            az group create \
              --name "$TFSTATE_RG" \
              --location "${LOCATION}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi

      - name: Create storage account
        run: |
          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --only-show-errors

          for attempt in $(seq 1 10); do
            if az storage account show \
              --name "${TFSTATE_STORAGE_ACCOUNT}" \
              --resource-group "$TFSTATE_RG" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --query id -o tsv >/dev/null 2>&1; then
              echo "Storage account '${TFSTATE_STORAGE_ACCOUNT}' already exists; skipping creation."
              exit 0
            fi

            if az storage account create \
              --name "${TFSTATE_STORAGE_ACCOUNT}" \
              --resource-group "$TFSTATE_RG" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --location "${LOCATION}" \
              --sku Standard_LRS \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --https-only true; then
              echo "Storage account '${TFSTATE_STORAGE_ACCOUNT}' created successfully."
              exit 0
            fi

            if [[ "$attempt" == "10" ]]; then
              echo "Storage account creation failed after $attempt attempts."
              exit 1
            fi

            echo "Storage account creation failed on attempt $attempt; waiting for Azure resource propagation..."
            sleep 15
          done

      - name: Create blob container
        run: |
          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --only-show-errors

          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group "$TFSTATE_RG" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
            --query "[0].value" \
            --output tsv)
          if az storage container show \
            --name "${TFSTATE_CONTAINER}" \
            --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --account-key "$ACCOUNT_KEY" >/dev/null 2>&1; then
            echo "Blob container '${TFSTATE_CONTAINER}' already exists; skipping creation."
          else
            az storage container create \
              --name "${TFSTATE_CONTAINER}" \
              --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --account-key "$ACCOUNT_KEY"
          fi

      - name: Assign Storage Blob Data Contributor to CI identity
        run: |
          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --only-show-errors

          STORAGE_ID=$(az storage account show \
            --name "${TFSTATE_STORAGE_ACCOUNT}" \
            --resource-group "$TFSTATE_RG" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query id --output tsv)
          # Get the service principal object ID for the federated OIDC identity
          CLIENT_OID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id --output tsv)
          ASSIGNMENT_COUNT=$(az role assignment list \
            --assignee-object-id "$CLIENT_OID" \
            --scope "$STORAGE_ID" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "[?roleDefinitionName=='Storage Blob Data Contributor'] | length(@)" \
            --output tsv)
          if [[ "$ASSIGNMENT_COUNT" == "0" ]]; then
            az role assignment create \
              --role "Storage Blob Data Contributor" \
              --assignee-object-id "$CLIENT_OID" \
              --assignee-principal-type ServicePrincipal \
              --scope "$STORAGE_ID" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          else
            echo "Storage Blob Data Contributor assignment already exists; skipping."
          fi

      - name: Terraform init for bootstrap state
        working-directory: infra/terraform/environments/${{ inputs.environment }}/platform
        run: |
          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --only-show-errors

          for attempt in $(seq 1 10); do
            if terraform init \
              -backend-config="resource_group_name=$TFSTATE_RG" \
              -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
              -backend-config="container_name=${TFSTATE_CONTAINER}" \
              -backend-config="key=$TFSTATE_KEY" \
              -backend-config="use_oidc=true"; then
              exit 0
            fi
            if [[ "$attempt" == "10" ]]; then
              echo "terraform init failed after $attempt attempts."
              exit 1
            fi
            echo "terraform init failed on attempt $attempt; waiting for RBAC propagation..."
            sleep 15
          done

      - name: Import workload resource group into Terraform state
        working-directory: infra/terraform/environments/${{ inputs.environment }}/platform
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          RG_ID="/subscriptions/$SUB_ID/resourceGroups/$WORKLOAD_RG"
          if terraform state show azurerm_resource_group.this > /dev/null 2>&1; then
            echo "Terraform state already tracks azurerm_resource_group.this; skipping import."
          else
            terraform import -input=false azurerm_resource_group.this "$RG_ID"
          fi

      - name: Summary
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          SUB_NAME=$(az account show --query name -o tsv)
          echo "## Bootstrap Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target subscription: \`$SUB_NAME\` (\`$SUB_ID\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Initialized Terraform environment: \`${ENVIRONMENT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Workload resource group: \`$WORKLOAD_RG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tfstate resource group: \`$TFSTATE_RG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Imported state key: \`$TFSTATE_KEY\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set these GitHub Actions **Variables** before running any other workflow:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variable | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`TFSTATE_RESOURCE_GROUP\` | \`$TFSTATE_RG\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`TFSTATE_STORAGE_ACCOUNT\` | \`${TFSTATE_STORAGE_ACCOUNT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`TFSTATE_CONTAINER\` | \`${TFSTATE_CONTAINER}\` |" >> "$GITHUB_STEP_SUMMARY"
