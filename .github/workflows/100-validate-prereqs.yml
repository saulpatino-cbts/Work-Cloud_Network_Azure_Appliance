name: "100 · Validate Prerequisites"
# Run this workflow after 000-bootstrap-backend to confirm that all required
# GitHub Secrets, GitHub Variables, and Azure OIDC authentication are in place.
#
# Safe to run at any time — read-only, makes no changes to Azure or GitHub.
#
# What it checks:
#   1. Required GitHub Secrets are non-empty
#   2. Required GitHub Variables are set and not placeholder values
#   3. Azure login succeeds via OIDC (confirms app registration + federated
#      credential + role assignment are all correctly configured)
#   4. Prints a pass/fail summary to the workflow step summary

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Read-only preflight — a newer dispatch supersedes an in-flight one so two
# manual runs never report on different snapshots of the same configuration.
concurrency:
  group: validate-prereqs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check required GitHub Secrets
        env:
          # Map each secret to an env var so we can test for empty values.
          # GitHub redacts secret values in logs but we can detect empty strings.
          V_AZURE_CLIENT_ID:             ${{ secrets.AZURE_CLIENT_ID }}
          V_AZURE_TENANT_ID:             ${{ secrets.AZURE_TENANT_ID }}
          V_AZURE_SUBSCRIPTION_ID:       ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          V_CNA_POSTGRES_ADMIN_PASSWORD: ${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}
          V_CNA_ENTRA_CLIENT_SECRET:     ${{ secrets.CNA_ENTRA_CLIENT_SECRET }}
          V_CNA_NEXTAUTH_SECRET:         ${{ secrets.CNA_NEXTAUTH_SECRET }}
          V_CNA_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CNA_CREDENTIAL_ENCRYPTION_KEY }}
          V_DOCKERHUB_TOKEN:             ${{ secrets.DOCKERHUB_TOKEN }}
          V_GH_APP_ID:                   ${{ secrets.GH_APP_ID }}
          V_GH_APP_PRIVATE_KEY:          ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Optional secrets — mapped so the empty-string check can see them.
          V_FRONTDOOR_CERT_PFX_PASSWORD: ${{ secrets.FRONTDOOR_CERTIFICATE_PFX_PASSWORD }}
        run: |
          echo "## Secret Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Required For | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          check_secret() {
            local name="$1"
            local value="$2"
            local scope="${3:-all workflows}"
            if [[ -z "$value" ]]; then
              if [[ "$scope" == "all workflows" ]]; then
                echo "| \`$name\` | $scope | ❌ Missing |" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::Secret $name is not set"
                FAILED=1
              else
                echo "| \`$name\` | $scope | ⚠️ Not set (optional) |" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::Optional secret $name not set — needed for: $scope"
              fi
            else
              echo "| \`$name\` | $scope | ✅ Set |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          # Core — required for workflows 000-320
          check_secret "AZURE_CLIENT_ID"             "$V_AZURE_CLIENT_ID"
          check_secret "AZURE_TENANT_ID"             "$V_AZURE_TENANT_ID"
          check_secret "AZURE_SUBSCRIPTION_ID"       "$V_AZURE_SUBSCRIPTION_ID"
          check_secret "CNA_POSTGRES_ADMIN_PASSWORD" "$V_CNA_POSTGRES_ADMIN_PASSWORD"
          check_secret "CNA_ENTRA_CLIENT_SECRET"     "$V_CNA_ENTRA_CLIENT_SECRET"
          check_secret "CNA_NEXTAUTH_SECRET"         "$V_CNA_NEXTAUTH_SECRET"
          check_secret "CNA_CREDENTIAL_ENCRYPTION_KEY" "$V_CNA_CREDENTIAL_ENCRYPTION_KEY"
          check_secret "DOCKERHUB_TOKEN"             "$V_DOCKERHUB_TOKEN"
          check_secret "GH_APP_ID"                   "$V_GH_APP_ID"
          check_secret "GH_APP_PRIVATE_KEY"          "$V_GH_APP_PRIVATE_KEY"

          # Optional — required only for specific workflows
          check_secret "FRONTDOOR_CERTIFICATE_PFX_PASSWORD" "$V_FRONTDOOR_CERT_PFX_PASSWORD" "workflow 210 verify (customer TLS)"

          if [[ "$FAILED" -eq 1 ]]; then
            echo ""
            echo "::error::One or more required secrets are missing. Run scripts/Initialize-CnaGitHubSecrets.ps1 to set them."
            exit 1
          fi
          echo "All secrets present ✅"

      - name: Check required GitHub Variables
        env:
          TFSTATE_RESOURCE_GROUP:    ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT:   ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER:         ${{ vars.TFSTATE_CONTAINER }}
          AZURE_REGION_SHORT:        ${{ vars.AZURE_REGION_SHORT }}
          DOCKERHUB_NAMESPACE:       ${{ vars.DOCKERHUB_NAMESPACE }}
          IMAGE_SIGNING_IDENTITY: ${{ vars.IMAGE_SIGNING_IDENTITY }}
          CNA_ENTRA_CLIENT_ID:       ${{ vars.CNA_ENTRA_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID:         ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          APPLICATION_INSIGHTS_NAME: ${{ vars.APPLICATION_INSIGHTS_NAME }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Variable Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variable | Value | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          check_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "| \`$name\` | _(empty)_ | ❌ Missing |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Secret $name is not set"
              FAILED=1
            else
              echo "| \`$name\` | \`$value\` | ✅ Set |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          check_var() {
            local name="$1"
            local value="$2"
            local allow_none="${3:-false}"  # some vars start as 'none' until Terraform creates the resource
            if [[ -z "$value" ]]; then
              echo "| \`$name\` | _(empty)_ | ❌ Missing |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Variable $name is not set"
              FAILED=1
            elif [[ "$allow_none" == "false" && "$value" == "none" ]]; then
              echo "| \`$name\` | \`none\` | ⚠️ Placeholder |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Variable $name is still set to 'none' — update after Terraform deploy"
            elif [[ "$value" == *"PLACEHOLDER"* || "$value" == *"example.com"* ]]; then
              echo "| \`$name\` | \`$value\` | ⚠️ Placeholder |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Variable $name still has a placeholder value"
            else
              echo "| \`$name\` | \`$value\` | ✅ Set |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          check_optional_var() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" || "$value" == "none" ]]; then
              echo "| \`$name\` | _not configured_ | ℹ️ Optional |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$name\` | \`$value\` | ✅ Set |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          # Core tfstate vars — must be set, must not be placeholders
          check_var "TFSTATE_RESOURCE_GROUP"  "$TFSTATE_RESOURCE_GROUP"
          check_var "TFSTATE_STORAGE_ACCOUNT" "$TFSTATE_STORAGE_ACCOUNT"
          check_var "TFSTATE_CONTAINER"       "$TFSTATE_CONTAINER"
          check_var "AZURE_REGION_SHORT"      "$AZURE_REGION_SHORT"
          check_var "DOCKERHUB_NAMESPACE"     "$DOCKERHUB_NAMESPACE"
          # T-703: the core workflow identity 210/220 verify every image signature against.
          check_var "IMAGE_SIGNING_IDENTITY" "$IMAGE_SIGNING_IDENTITY"
          check_var "CNA_ENTRA_CLIENT_ID"     "$CNA_ENTRA_CLIENT_ID"
          check_secret "AZURE_SUBSCRIPTION_ID" "$AZURE_SUBSCRIPTION_ID"

          # AI/MCP variables are optional and fall back to Terraform defaults at deploy time.

          # Post-deploy vars — allowed to be 'none' before first Terraform run
          check_var "APPLICATION_INSIGHTS_NAME" "$APPLICATION_INSIGHTS_NAME" "true"

          # CNA_NEXTAUTH_URL and KEY_VAULT_NAME are NOT checked here: this job runs
          # with no `environment:` key (it's a repo-level preflight, see the header
          # comment), but both are environment-scoped GitHub variables written by
          # each stack's own Terraform apply (dev/workload and prod/workload
          # main.tf) — reading `vars.*` here would only ever see the stale
          # repository-scoped fallback, not either environment's real value.
          # To read a specific environment's value, fetch it directly from that
          # environment's Azure Key Vault (az keyvault secret show) under your own
          # identity, or from the environment-scoped GitHub variable itself.

          if [[ "$FAILED" -eq 1 ]]; then
            echo ""
            echo "::error::One or more required variables are missing."
            exit 1
          fi
          echo "All variables present ✅"

      # Catches the AADSTS700016 sign-in failure BEFORE users hit it: a teardown
      # can delete the NextAuth app registration while CNA_ENTRA_CLIENT_ID keeps
      # the old id (the bootstrap previously "kept existing" — now fixed, but
      # this guards regressions and manual edits). The deploy SPs have no Graph
      # read permissions, so instead of az ad app show this probes the public
      # token endpoint with a deliberately bogus secret: a DEAD client id gets
      # AADSTS700016 ("application not found"); a LIVE one gets AADSTS7000215
      # ("invalid client secret") — verified against both cases. No credentials
      # are exposed and nothing is issued either way.
      - name: Verify CNA_ENTRA_CLIENT_ID resolves in the tenant
        env:
          CLIENT_ID:  ${{ vars.CNA_ENTRA_CLIENT_ID }}
          TENANT_ID:  ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [[ -z "$CLIENT_ID" || "$CLIENT_ID" == "none" ]]; then
            echo "CNA_ENTRA_CLIENT_ID not set yet; skipping probe."
            exit 0
          fi
          RESPONSE=$(curl -s -X POST "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -d "client_id=${CLIENT_ID}&client_secret=probe&grant_type=client_credentials&scope=https://graph.microsoft.com/.default" || echo "")
          if grep -q "AADSTS700016" <<<"$RESPONSE"; then
            echo "::error::CNA_ENTRA_CLIENT_ID ($CLIENT_ID) does not exist in tenant $TENANT_ID (AADSTS700016). The app registration was likely deleted and recreated — re-run scripts/Initialize-CnaGitHubSecrets.ps1 to refresh the variable and rotate CNA_ENTRA_CLIENT_SECRET, then redeploy."
            exit 1
          fi
          echo "CNA_ENTRA_CLIENT_ID resolves in the tenant ✅"

      - name: Validate Docker Hub image pull access
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [[ -z "$DOCKERHUB_NAMESPACE" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::DOCKERHUB_NAMESPACE and DOCKERHUB_TOKEN are required so Azure Container Apps can pull private Docker Hub images."
            exit 1
          fi

          # Deploy-by-digest leaves no floating tag to probe (T-701). Verify pull
          # access with the Docker registry v2 API instead: fetch a pull-scoped
          # bearer token, then list one tag. The token is never printed.
          set -euo pipefail
          TOKEN=$(curl -sS -u "${DOCKERHUB_NAMESPACE}:${DOCKERHUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${DOCKERHUB_NAMESPACE}/cna:pull" \
            | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not obtain a Docker Hub pull token for ${DOCKERHUB_NAMESPACE}/cna — check DOCKERHUB_NAMESPACE and DOCKERHUB_TOKEN."
            exit 1
          fi
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry-1.docker.io/v2/${DOCKERHUB_NAMESPACE}/cna/tags/list?n=1")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Docker Hub pull access check failed for ${DOCKERHUB_NAMESPACE}/cna (HTTP ${STATUS})."
            exit 1
          fi
          echo "Docker Hub pull access for ${DOCKERHUB_NAMESPACE}/cna: OK"

      - name: Azure login via OIDC
        id: azure_login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure access
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Azure Access Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Confirm subscription is visible
          SUB_NAME=$(az account show --query name -o tsv)
          SUB_ID=$(az account show --query id -o tsv)
          TENANT_ID=$(az account show --query tenantId -o tsv)

          echo "| Check | Value | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| OIDC login | ✅ Succeeded | |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Subscription | \`$SUB_NAME\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Subscription ID | \`$SUB_ID\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tenant ID | \`$TENANT_ID\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"

          EXPECTED_SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          EXPECTED_SUB_NAME="${{ vars.AZURE_TARGET_SUBSCRIPTION_NAME }}"

          if [[ -n "$EXPECTED_SUB_ID" && "$EXPECTED_SUB_ID" != "none" && "$EXPECTED_SUB_ID" != "$SUB_ID" ]]; then
            echo "| Expected subscription ID | \`$EXPECTED_SUB_ID\` | ❌ Mismatch |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Authenticated to subscription $SUB_ID, but AZURE_SUBSCRIPTION_ID expects $EXPECTED_SUB_ID"
            exit 1
          fi

          if [[ -n "$EXPECTED_SUB_NAME" && "$EXPECTED_SUB_NAME" != "none" && "$EXPECTED_SUB_NAME" != "$SUB_NAME" ]]; then
            echo "| Expected subscription name | \`$EXPECTED_SUB_NAME\` | ❌ Mismatch |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Authenticated to subscription '$SUB_NAME', but AZURE_TARGET_SUBSCRIPTION_NAME expects '$EXPECTED_SUB_NAME'"
            exit 1
          fi

          # Verify Contributor role is assigned
          APP_ID="${{ secrets.AZURE_CLIENT_ID }}"
          CONTRIBUTOR=$(az role assignment list \
            --assignee "$APP_ID" \
            --role Contributor \
            --scope "/subscriptions/$SUB_ID" \
            --query "[0].roleDefinitionName" -o tsv 2>/dev/null || echo "")

          UAA=$(az role assignment list \
            --assignee "$APP_ID" \
            --role "User Access Administrator" \
            --scope "/subscriptions/$SUB_ID" \
            --query "[0].roleDefinitionName" -o tsv 2>/dev/null || echo "")

          if [[ -n "$CONTRIBUTOR" ]]; then
            echo "| Contributor role | Assigned | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Contributor role | ❌ Not assigned | |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Contributor role not found. Run: az role assignment create --role Contributor --assignee $APP_ID --scope /subscriptions/$SUB_ID"
          fi

          if [[ -n "$UAA" ]]; then
            echo "| User Access Admin role | Assigned | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| User Access Admin role | ❌ Not assigned | |" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::User Access Administrator role not found — Terraform may fail when assigning roles to managed identities"
          fi

          # Verify tfstate storage account is accessible (only after workflow 000 has run)
          TFSTATE_SA="${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          TFSTATE_RG="${{ vars.TFSTATE_RESOURCE_GROUP }}"
          if [[ "$TFSTATE_SA" != "none" && -n "$TFSTATE_SA" ]]; then
            SA_EXISTS=$(az storage account show \
              --name "$TFSTATE_SA" \
              --resource-group "$TFSTATE_RG" \
              --query name -o tsv 2>/dev/null || echo "")
            if [[ -n "$SA_EXISTS" ]]; then
              echo "| Tfstate storage account | \`$TFSTATE_SA\` exists | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| Tfstate storage account | \`$TFSTATE_SA\` not found | ⚠️ Run workflow 000 |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Storage account $TFSTATE_SA not found in $TFSTATE_RG — run workflow 000 to create it"
            fi
          fi

          # Required resource providers, derived from the resource types the Azure
          # roots actually declare (TODO.md T-104). An unregistered provider does
          # not fail the plan — it fails partway through apply, ~20 minutes in,
          # leaving a half-provisioned environment. Checking here turns that into
          # a 30-second failure with the exact `az provider register` to run.
          #
          # Declared as one list rather than inline per check, so adding a service
          # to the Terraform means adding one line here. Keep it in sync with:
          #   grep -rhoE 'resource "azurerm_[a-z0-9_]+"' infra/terraform/*/azure/
          #
          #   Microsoft.App                — container_app, container_app_environment
          #   Microsoft.Network            — vnet, subnet, NSG, public_ip, route_table,
          #                                  private_dns_zone, private_endpoint, firewall,
          #                                  and the azapi networkWatchers/flowLogs
          #   Microsoft.Storage            — storage_account, container, mgmt policy,
          #                                  static website
          #   Microsoft.KeyVault           — key_vault, secret, certificate
          #   Microsoft.DBforPostgreSQL    — postgresql_flexible_server + database + config
          #   Microsoft.CognitiveServices  — cognitive_account, cognitive_deployment,
          #                                  and the azapi accounts/projects (Foundry)
          #   Microsoft.OperationalInsights— log_analytics_workspace
          #   Microsoft.Insights           — monitor_diagnostic_setting
          #   Microsoft.Cdn                — the nine cdn_frontdoor_* resources
          #   Microsoft.ManagedIdentity    — user_assigned_identity
          #
          # Deliberately NOT checked: Microsoft.Resources (resource_group) and
          # Microsoft.Authorization (role_assignment) are registered on every
          # subscription and cannot be unregistered, so asserting them is noise.
          #
          # Microsoft.AlertsManagement is deliberately absent. REVIEW.md R-007 asked
          # the subscription owner to register it for Application Insights
          # smart-detection alerts, but the split refactor removed alerting entirely:
          # there is no application_insights, no monitor_smart_detector_alert_rule,
          # no monitor_metric_alert, and no monitor_action_group anywhere in infra/.
          # The only monitor resource left is monitor_diagnostic_setting, which is
          # Microsoft.Insights. Verified 2026-08-18; R-007 closed on that basis.
          REQUIRED_PROVIDERS=(
            Microsoft.App
            Microsoft.Network
            Microsoft.Storage
            Microsoft.KeyVault
            Microsoft.DBforPostgreSQL
            Microsoft.CognitiveServices
            Microsoft.OperationalInsights
            Microsoft.Insights
            Microsoft.Cdn
            Microsoft.ManagedIdentity
          )
          PROVIDER_FAILED=0
          for ns in "${REQUIRED_PROVIDERS[@]}"; do
            STATE=$(az provider show --namespace "$ns" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")
            if [[ "$STATE" == "Registered" ]]; then
              echo "| $ns | Registered | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$STATE" == "Registering" ]]; then
              # Transient: registration was started but has not finished. Telling
              # someone to run `az provider register` again would be wrong advice.
              echo "| $ns | Registering | ⏳ Wait and re-run |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$ns registration is still in progress. Wait for it to reach Registered, then re-run this workflow."
              PROVIDER_FAILED=1
            else
              echo "| $ns | $STATE | ❌ Register before deploy |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$ns is not registered in this subscription. Run: az provider register --namespace $ns"
              PROVIDER_FAILED=1
            fi
          done
          if [[ "$PROVIDER_FAILED" -eq 1 ]]; then
            exit 1
          fi

          echo ""
          echo "Azure access verified ✅"

      - name: Final summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Next step:** If all checks are green, run workflow \`200 · Build Container Images\`, then workflow \`211 · Deploy Azure Platform (Split)\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If any checks show ⚠️ placeholder values, those variables will be updated after the first Terraform deploy (workflow 210)." >> "$GITHUB_STEP_SUMMARY"
