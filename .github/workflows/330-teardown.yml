name: "330 · Teardown Platform"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: "Type DESTROY to confirm — this deletes ALL resources in the target environment"
        required: true
        type: string
      destroy_tfstate_backend:
        description: "Also destroy the configured Terraform state backend RG — only for full reset"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      delete_drifted_resources:
        description: "Delete drifted AI resources after preview; leave false to review preview output first"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      region_short:
        description: "Short Azure region code used in CNA resource names; defaults to AZURE_REGION_SHORT variable"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
  AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
  # Bind dispatch inputs to env so no run: block interpolates them into shell.
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  CONFIRM: ${{ github.event.inputs.confirm }}

concurrency:
  group: azure-environment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ── Safety gate ──────────────────────────────────────────────────────────────
  preflight:
    name: Preflight safety check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment == 'prod' && 'hub' || inputs.environment }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate client target before cloud login
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          AZURE_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: bash scripts/ci/validate_client_config.sh teardown

      - name: Validate confirmation string
        run: |
          if [[ "${CONFIRM}" != "DESTROY" ]]; then
            echo "::error::Confirmation string must be exactly 'DESTROY'. Got: '${CONFIRM}'"
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with teardown of ${ENVIRONMENT}."

      - name: Block prod teardown on non-default branch
        if: github.event.inputs.environment == 'prod'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::Production teardown must be triggered from the repository default branch."
            exit 1
          fi

  # ── Terraform destroy ────────────────────────────────────────────────────────
  terraform-destroy:
    name: "terraform destroy (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: preflight
    # Prod teardown destroys every resource in the environment, so it runs under
    # the human-gated `hub` environment (required reviewers); dev runs under dev.
    environment: ${{ github.event.inputs.environment == 'prod' && 'hub' || github.event.inputs.environment }}
    outputs:
      workload_rg: ${{ steps.names.outputs.workload_rg }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target subscription
        env:
          VAR_TARGET_SUBSCRIPTION_NAME: ${{ vars.AZURE_TARGET_SUBSCRIPTION_NAME }}
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          SUB_NAME=$(az account show --query name -o tsv)
          EXPECTED_SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          EXPECTED_SUB_NAME="$VAR_TARGET_SUBSCRIPTION_NAME"

          if [[ -n "$EXPECTED_SUB_ID" && "$EXPECTED_SUB_ID" != "none" && "$EXPECTED_SUB_ID" != "$SUB_ID" ]]; then
            echo "::error::Authenticated to subscription $SUB_ID, but AZURE_SUBSCRIPTION_ID expects $EXPECTED_SUB_ID"
            exit 1
          fi

          if [[ -n "$EXPECTED_SUB_NAME" && "$EXPECTED_SUB_NAME" != "none" && "$EXPECTED_SUB_NAME" != "$SUB_NAME" ]]; then
            echo "::error::Authenticated to subscription '$SUB_NAME', but AZURE_TARGET_SUBSCRIPTION_NAME expects '$EXPECTED_SUB_NAME'"
            exit 1
          fi

      - name: Derive workload resource group name
        id: names
        env:
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
          INPUT_REGION_SHORT: ${{ github.event.inputs.region_short }}
          TFSTATE_RG: ${{ vars.TFSTATE_RESOURCE_GROUP }}
        run: |
          RS="${INPUT_REGION_SHORT:-$REGION_SHORT}"
          if [[ -n "$TFSTATE_RG" && "$TFSTATE_RG" == *-tfstate ]]; then
            WORKLOAD_RG="${TFSTATE_RG%-tfstate}"
          elif [[ -n "$RS" ]]; then
            WORKLOAD_RG="rg-cna-${ENVIRONMENT}-${RS}"
          else
            echo "::error::AZURE_REGION_SHORT is required to derive workload resource group name."
            exit 1
          fi
          echo "workload_rg=${WORKLOAD_RG}" >> "$GITHUB_OUTPUT"

      - name: Delete workload resource group and wait before clearing state
        env:
          WORKLOAD_RG: ${{ steps.names.outputs.workload_rg }}
        run: |
          RG="${WORKLOAD_RG}"
          if [[ "$(az group exists --name "$RG")" == false ]]; then
            echo "Resource group $RG does not exist — nothing to delete."
            exit 0
          fi
          echo "Deleting resource group $RG asynchronously..."
          az group delete --name "$RG" --yes --no-wait
          az group wait --name "$RG" --deleted --interval 30 --timeout 2700
          echo "Workload resource group deletion completed; state may now be cleared."

      - name: Clear Terraform state blobs (platform + workload)
        env:
          VAR_TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          VAR_TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          # The split deploy keeps TWO state keys: <env>.terraform.tfstate
          # (platform) and <env>.workload.terraform.tfstate (workload). Both must
          # be cleared or the next deploy trips on "already exists" for resources
          # the surviving state still references.
          for KEY in \
            "${ENVIRONMENT}.terraform.tfstate" \
            "${ENVIRONMENT}.workload.terraform.tfstate"; do
            echo "Clearing state blob: $KEY"
            EXISTS=$(az storage blob exists \
              --account-name "$VAR_TFSTATE_STORAGE_ACCOUNT" \
              --container-name "$VAR_TFSTATE_CONTAINER" \
              --name "$KEY" --auth-mode login --query exists -o tsv)
            [[ "$EXISTS" == false ]] && continue
            az storage blob delete \
              --account-name "$VAR_TFSTATE_STORAGE_ACCOUNT" \
              --container-name "$VAR_TFSTATE_CONTAINER" \
              --name "$KEY" \
              --auth-mode login \
              --only-show-errors --output none
          done
          echo "State files cleared — next deploy starts from a blank slate."

  # ── Clean up drifted resources not in Terraform state ────────────────────────
  cleanup-drift:
    name: "Remove drifted resources (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: terraform-destroy
    # Prod drift deletion is human-gated under `hub`; dev runs under dev.
    environment: ${{ github.event.inputs.environment == 'prod' && 'hub' || github.event.inputs.environment }}
    # Cleanup failures stay visible and block optional backend deletion.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview CNA cleanup targets
        env:
          INPUT_REGION_SHORT: ${{ github.event.inputs.region_short }}
          VAR_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          REGION_SHORT="${INPUT_REGION_SHORT:-$VAR_REGION_SHORT}"
          if [[ -z "$REGION_SHORT" ]]; then
            echo "::error::AZURE_REGION_SHORT is required, or pass region_short when dispatching workflow 330."
            exit 1
          fi
          pwsh -File ./scripts/Remove-CnaStaleAiResources.ps1 -Environment "${ENVIRONMENT}" -RegionShort "$REGION_SHORT" -Scope StaleAi

      - name: Delete drifted resources (not managed by Terraform)
        if: github.event.inputs.delete_drifted_resources == 'true'
        env:
          INPUT_REGION_SHORT: ${{ github.event.inputs.region_short }}
          VAR_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          REGION_SHORT="${INPUT_REGION_SHORT:-$VAR_REGION_SHORT}"
          if [[ -z "$REGION_SHORT" ]]; then
            echo "::error::AZURE_REGION_SHORT is required, or pass region_short when dispatching workflow 330."
            exit 1
          fi
          pwsh -File ./scripts/Remove-CnaStaleAiResources.ps1 -Environment "${ENVIRONMENT}" -RegionShort "$REGION_SHORT" -Scope StaleAi -Delete

      - name: Require explicit rerun for drift deletion
        if: github.event.inputs.delete_drifted_resources != 'true'
        run: |
          echo "Preview complete. Review the cleanup target list above."
          echo "Re-run workflow 330 with delete_drifted_resources=true only after approving the preview."

  # ── Purge soft-deleted Cognitive Services accounts ──────────────────────────
  # AIServices accounts soft-delete on RG deletion and keep their name reserved
  # (subscription+region scoped), so the next deploy 409s with
  # "FlagMustBeSetForRestore" unless the tombstone is purged. The provider-level
  # purge_soft_delete_on_destroy only fires on `terraform destroy`; the
  # `az group delete` path above bypasses it, so this job is the backstop that
  # infra/terraform/**/providers.tf refers to.
  #
  # Every destructive prod job uses hub. The client must grant the selected
  # environment identity only the reviewed purge rights; never fall back to a
  # broader repository-scoped identity to bypass an authorization failure.
  purge-soft-deleted:
    name: "Purge soft-deleted AI accounts (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: terraform-destroy
    environment: ${{ inputs.environment == 'prod' && 'hub' || inputs.environment }}
    # Workload deletion already completed; missing purge rights must stay visible.
    steps:
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for RG deletion, then purge
        run: |
          RG="${{ needs.terraform-destroy.outputs.workload_rg }}"
          if [[ -z "$RG" ]]; then
            echo "::warning::Workload RG name unavailable — skipping purge backstop."
            exit 0
          fi

          # Accounts only enter the soft-deleted list once the async
          # `az group delete --no-wait` above actually finishes.
          echo "Waiting for resource group $RG deletion to complete..."
          for i in $(seq 1 90); do
            if [[ "$(az group exists --name "$RG")" == "false" ]]; then
              echo "Resource group deleted."
              break
            fi
            if [[ "$i" == "90" ]]; then
              echo "::error::$RG still exists after 45 minutes; refusing purge."
              exit 1
            fi
            sleep 30
          done

          FOUND=0
          while IFS=$'\t' read -r NAME LOC; do
            [[ -z "$NAME" ]] && continue
            FOUND=1
            echo "Purging soft-deleted Cognitive Services account: $NAME ($LOC)"
            az cognitiveservices account purge -l "$LOC" -g "$RG" -n "$NAME" --only-show-errors
          done < <(az cognitiveservices account list-deleted \
            --query "[?contains(id, '/resourceGroups/${RG}/')].[name,location]" -o tsv)

          if [[ "$FOUND" == "0" ]]; then
            echo "No soft-deleted Cognitive Services accounts found for $RG."
          fi

  # ── Optional: wipe TF state backend ─────────────────────────────────────────
  destroy-backend:
    name: "Destroy TF state backend RG"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: cleanup-drift
    if: github.event.inputs.destroy_tfstate_backend == 'true'
    # Backend deletion needs explicit client-owned rights on the backend RG.
    # Missing rights must fail rather than switch to an ungated identity.
    environment: ${{ inputs.environment == 'prod' && 'hub' || inputs.environment }}
    steps:
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target subscription
        env:
          VAR_TARGET_SUBSCRIPTION_NAME: ${{ vars.AZURE_TARGET_SUBSCRIPTION_NAME }}
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          SUB_NAME=$(az account show --query name -o tsv)
          EXPECTED_SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          EXPECTED_SUB_NAME="$VAR_TARGET_SUBSCRIPTION_NAME"

          if [[ -n "$EXPECTED_SUB_ID" && "$EXPECTED_SUB_ID" != "none" && "$EXPECTED_SUB_ID" != "$SUB_ID" ]]; then
            echo "::error::Authenticated to subscription $SUB_ID, but AZURE_SUBSCRIPTION_ID expects $EXPECTED_SUB_ID"
            exit 1
          fi

          if [[ -n "$EXPECTED_SUB_NAME" && "$EXPECTED_SUB_NAME" != "none" && "$EXPECTED_SUB_NAME" != "$SUB_NAME" ]]; then
            echo "::error::Authenticated to subscription '$SUB_NAME', but AZURE_TARGET_SUBSCRIPTION_NAME expects '$EXPECTED_SUB_NAME'"
            exit 1
          fi

      - name: Delete Terraform state backend resources
        env:
          VAR_TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          VAR_TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          echo "WARNING: Deleting Terraform state backend RG. All state will be permanently lost."
          TF_STATE_RG="$VAR_TFSTATE_RESOURCE_GROUP"

          az storage account delete \
            --name "$VAR_TFSTATE_STORAGE_ACCOUNT" \
            --resource-group "${TF_STATE_RG}" \
            --yes --output none

          az group delete \
            --name "${TF_STATE_RG}" \
            --yes --output none

          echo "State backend RG deletion completed. Run 000-bootstrap-backend only for an approved rebuild."
