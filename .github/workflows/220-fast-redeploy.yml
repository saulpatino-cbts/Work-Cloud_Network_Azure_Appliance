name: "220 · Fast Redeploy"
# Fast image update without a full Terraform apply.
# Use this when you only need to roll out a new container image to
# one or more Container Apps — no infrastructure changes.
# ~2 minutes vs ~10+ minutes for a full Terraform deploy.
# Prerequisite:
#   Azure infrastructure must already be deployed by workflow 210.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      resource_group:
        description: Optional workload resource group override (default derived from TFSTATE_RESOURCE_GROUP)
        required: false
        default: ""
        type: string
      api_image:
        description: New cna-api image (leave empty to skip)
        required: false
        default: ""
        type: string
      worker_image:
        description: New cna-worker image (leave empty to skip)
        required: false
        default: ""
        type: string
      web_image:
        description: New cna-web image (leave empty to skip)
        required: false
        default: ""
        type: string

env:
  # Image signing (core TODO.md T-703): the exact Sigstore identity the core's
  # 200-build-images signs with — from this repository variable only, never from
  # the manifest, the dispatch payload or an input — the issuer every GitHub
  # Actions signer shares, and the cosign release that verifies them (keep in
  # step with the core's COSIGN_VERSION).
  IMAGE_SIGNING_IDENTITY: ${{ vars.IMAGE_SIGNING_IDENTITY }}
  SIGSTORE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_VERSION: v3.1.3

permissions:
  id-token: write
  contents: read

# Serialize redeploys per environment so two overlapping runs don't race to
# update the same Container Apps revision; don't cancel an in-flight rollout.
concurrency:
  group: fast-redeploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate — at least one image must be specified
        env:
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          if [ -z "$INPUT_API_IMAGE" ] && \
             [ -z "$INPUT_WORKER_IMAGE" ] && \
             [ -z "$INPUT_WEB_IMAGE" ]; then
            echo "::error::At least one image (api_image, worker_image, or web_image) must be specified."
            exit 1
          fi

          # Shared across both appliances (T-701) — keep byte-identical.
          # Validates a container image reference for a role. NS is the Docker Hub
          # namespace ($DOCKERHUB_NAMESPACE). Refuses floating/empty; accepts a
          # digest-pinned reference; accepts (with a warning) a tag-only reference;
          # refuses anything else (wrong namespace, wrong role, extra characters).
          validate_image_ref() {
            local ROLE="$1" REF="$2"
            local NS="${DOCKERHUB_NAMESPACE}"
            local PINNED="^docker\.io/${NS}/cna:${ROLE}-sha-[0-9a-f]{7}@sha256:[0-9a-f]{64}$"
            local TAG_ONLY="^docker\.io/${NS}/cna:${ROLE}-sha-[0-9a-f]{7}$"
            local HOWTO="get a pinned reference from 230 (Image Update), the core's .deployment-catalog/latest-build.json (images.${ROLE} + digests.${ROLE}), or the update-available issue"
            if [ -z "$REF" ]; then
              echo "::error::${ROLE} image reference is empty (floating references are refused); ${HOWTO}."
              return 1
            fi
            if [[ "$REF" == *-latest || "$REF" == *:latest ]]; then
              echo "::error::${ROLE} image reference '${REF}' is a floating tag (refused); ${HOWTO}."
              return 1
            fi
            if [[ "$REF" =~ $PINNED ]]; then
              return 0
            fi
            if [[ "$REF" =~ $TAG_ONLY ]]; then
              echo "::warning::${ROLE} image reference '${REF}' is a tag-only reference; digest not pinned."
              return 0
            fi
            echo "::error::${ROLE} image reference '${REF}' is not a valid pinned reference; ${HOWTO}."
            return 1
          }

          # A fast redeploy only touches the images the caller names, so validate
          # each non-empty input and leave the empty ones to be skipped downstream.
          [ -n "$INPUT_API_IMAGE" ] && { validate_image_ref api "$INPUT_API_IMAGE" || exit 1; }
          [ -n "$INPUT_WORKER_IMAGE" ] && { validate_image_ref worker "$INPUT_WORKER_IMAGE" || exit 1; }
          [ -n "$INPUT_WEB_IMAGE" ] && { validate_image_ref web "$INPUT_WEB_IMAGE" || exit 1; }
          true

      # Shared across both appliances (T-703) — keep byte-identical. 220 bypasses
      # Terraform and the catalog but not the signature gate: every image it is
      # about to roll must carry the core's keyless signature and provenance
      # attestation (scripts/ci/verify_image_signature.sh, the same check 210
      # runs). The checkout is for that script only.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify image signatures and provenance
        env:
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_NAMESPACE" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::DOCKERHUB_NAMESPACE and DOCKERHUB_TOKEN are required to read the image signatures from Docker Hub."
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_NAMESPACE" --password-stdin
          [ -n "$INPUT_API_IMAGE" ]    && scripts/ci/verify_image_signature.sh api    "$INPUT_API_IMAGE"
          [ -n "$INPUT_WORKER_IMAGE" ] && scripts/ci/verify_image_signature.sh worker "$INPUT_WORKER_IMAGE"
          [ -n "$INPUT_WEB_IMAGE" ]    && scripts/ci/verify_image_signature.sh web    "$INPUT_WEB_IMAGE"
          true

      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Derive Container App names from environment
        id: names
        env:
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_RG: ${{ inputs.resource_group }}
          TFSTATE_RG: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          if [ -n "$INPUT_RG" ]; then
            WORKLOAD_RG="$INPUT_RG"
          elif [ -n "$TFSTATE_RG" ] && [[ "$TFSTATE_RG" == *-tfstate ]]; then
            WORKLOAD_RG="${TFSTATE_RG%-tfstate}"
          elif [ -n "$REGION_SHORT" ]; then
            WORKLOAD_RG="rg-cna-${INPUT_ENV}-${REGION_SHORT}"
          else
            echo "::error::AZURE_REGION_SHORT is required when TFSTATE_RESOURCE_GROUP is not set."
            exit 1
          fi

          PREFIX="${WORKLOAD_RG#rg-}"
          echo "api_app=${PREFIX}-ca-api"       >> "$GITHUB_OUTPUT"
          echo "worker_app=${PREFIX}-ca-worker" >> "$GITHUB_OUTPUT"
          echo "web_app=${PREFIX}-ca-web"       >> "$GITHUB_OUTPUT"
          echo "resource_group=${WORKLOAD_RG}"  >> "$GITHUB_OUTPUT"

      - name: Update cna-api image
        if: inputs.api_image != ''
        env:
          API_IMAGE: ${{ inputs.api_image }}
          API_APP: ${{ steps.names.outputs.api_app }}
          RESOURCE_GROUP: ${{ steps.names.outputs.resource_group }}
        run: |
          az containerapp update \
            --name "$API_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$API_IMAGE"

      - name: Update cna-worker image
        if: inputs.worker_image != ''
        env:
          WORKER_IMAGE: ${{ inputs.worker_image }}
          WORKER_APP: ${{ steps.names.outputs.worker_app }}
          RESOURCE_GROUP: ${{ steps.names.outputs.resource_group }}
        run: |
          az containerapp update \
            --name "$WORKER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$WORKER_IMAGE"

      - name: Update cna-web image
        if: inputs.web_image != ''
        env:
          WEB_IMAGE: ${{ inputs.web_image }}
          WEB_APP: ${{ steps.names.outputs.web_app }}
          RESOURCE_GROUP: ${{ steps.names.outputs.resource_group }}
        run: |
          az containerapp update \
            --name "$WEB_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$WEB_IMAGE"

      - name: Verify cna-web health after update
        if: inputs.web_image != ''
        env:
          WEB_APP: ${{ steps.names.outputs.web_app }}
          RESOURCE_GROUP: ${{ steps.names.outputs.resource_group }}
        run: |
          sleep 20
          WEB_FQDN=$(az containerapp show \
            --name "$WEB_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${WEB_FQDN}/api/health" || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::cna-web /api/health returned $STATUS — check Application Insights for errors."
          fi

      - name: Summary
        env:
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
          API_APP: ${{ steps.names.outputs.api_app }}
          WORKER_APP: ${{ steps.names.outputs.worker_app }}
          WEB_APP: ${{ steps.names.outputs.web_app }}
        run: |
          echo "## Refresh Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container App | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$INPUT_API_IMAGE" ]; then
            echo "| \`${API_APP}\` | \`${INPUT_API_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$INPUT_WORKER_IMAGE" ]; then
            echo "| \`${WORKER_APP}\` | \`${INPUT_WORKER_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$INPUT_WEB_IMAGE" ]; then
            echo "| \`${WEB_APP}\` | \`${INPUT_WEB_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
