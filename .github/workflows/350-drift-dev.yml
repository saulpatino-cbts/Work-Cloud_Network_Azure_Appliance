name: "350 · Drift Detection · dev"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  id-token: write
  contents: read

# Skip a scheduled drift scan if a prior one (or a manual dispatch) is still
# running — overlapping drift plans against the same state are redundant.
concurrency:
  group: drift-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    outputs:
      # "missing-environment" when the state backend or the state itself is
      # gone; "check-failed" for any other failure. Read by report-failure.
      failure_kind: ${{ steps.init-platform.outputs.failure_kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Terraform backend targets
        run: |
          echo "TFSTATE_RESOURCE_GROUP=${{ vars.TFSTATE_RESOURCE_GROUP }}" >> "$GITHUB_ENV"
          echo "TFSTATE_STORAGE_ACCOUNT=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" >> "$GITHUB_ENV"
          echo "TFSTATE_CONTAINER=${{ vars.TFSTATE_CONTAINER }}" >> "$GITHUB_ENV"

      # ── Platform state drift ────────────────────────────────────────────────
      - name: Terraform init (platform)
        id: init-platform
        working-directory: infra/terraform/environments/dev/platform
        run: |
          # A drift check has three outcomes, not two: clean, drifted, and "the
          # environment does not exist". A missing state backend or an empty
          # state is the third, and it is reported as its own, louder failure
          # (failure_kind=missing-environment, read by report-failure) — never as
          # drift and never as an ordinary plan error (TODO.md T-105).
          INIT_LOG="$RUNNER_TEMP/init-platform.log"
          if ! terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=dev.terraform.tfstate" \
            -backend-config="use_oidc=true" > "$INIT_LOG" 2>&1; then
            cat "$INIT_LOG"
            if grep -qE 'ResourceGroupNotFound|StorageAccountNotFound|ContainerNotFound|ResourceNotFound|was not found|could not be found' "$INIT_LOG"; then
              echo "failure_kind=missing-environment" >> "$GITHUB_OUTPUT"
              echo "::error::The dev Terraform state backend (resource group, storage account or container) does not exist — the environment has been deleted out of band or was never bootstrapped. This is not drift."
            else
              echo "failure_kind=check-failed" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          cat "$INIT_LOG"
          if [ -z "$(terraform state list 2>/dev/null)" ]; then
            echo "failure_kind=missing-environment" >> "$GITHUB_OUTPUT"
            echo "::error::dev/platform state is empty — the environment has never been deployed or has been destroyed. This is not drift."
            exit 1
          fi
          echo "failure_kind=check-failed" >> "$GITHUB_OUTPUT"

      - name: Terraform drift plan (platform)
        working-directory: infra/terraform/environments/dev/platform
        run: |
          AI_MODE=$(jq -r '.ai_mode // "saas"' "$GITHUB_WORKSPACE/.deployment-catalog/dev/latest.json" 2>/dev/null || echo saas)
          # -detailed-exitcode: 0 = clean, 2 = drift (warn), anything else = the
          # plan itself failed and must fail the job, never be read as "no drift".
          EXIT=0
          terraform plan -detailed-exitcode -var="ai_mode=${AI_MODE:-saas}" || EXIT=$?
          if [ "$EXIT" -eq 2 ]; then
            echo "::warning::Drift detected in dev/platform state."
          elif [ "$EXIT" -ne 0 ]; then
            echo "::error::terraform plan failed for dev/platform (exit $EXIT)."
            exit "$EXIT"
          fi

      # ── Workload state drift ────────────────────────────────────────────────
      - name: Terraform init (workload)
        working-directory: infra/terraform/environments/dev/workload
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=dev.workload.terraform.tfstate" \
            -backend-config="use_oidc=true"

      # Key Vault is deny-by-default (default_action = Deny). The workload drift
      # plan refreshes KV secret resources over the data plane, so the runner's
      # public IP must be allow-listed first (removed again at the end).
      - name: Ensure Key Vault is reachable during drift plan
        env:
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          if [[ -n "$TFSTATE_RESOURCE_GROUP" && "$TFSTATE_RESOURCE_GROUP" == *-tfstate ]]; then
            WORKLOAD_RG="${TFSTATE_RESOURCE_GROUP%-tfstate}"
          elif [[ -n "$REGION_SHORT" ]]; then
            WORKLOAD_RG="rg-cna-dev-${REGION_SHORT}"
          else
            echo "::error::AZURE_REGION_SHORT is required when TFSTATE_RESOURCE_GROUP is not set."
            exit 1
          fi
          # Trust the Terraform-maintained KEY_VAULT_NAME variable (the real name
          # carries a suffix), but only if it matches THIS environment's prefix —
          # the variable is repo-level and both env workloads write it (last
          # apply wins). Bare "-kv" is the pre-first-apply fallback.
          KEY_VAULT_NAME="${{ vars.KEY_VAULT_NAME }}"
          if [[ "$KEY_VAULT_NAME" != "${WORKLOAD_RG#rg-}-kv"* ]]; then
            # Variable missing or belongs to the other environment — resolve the
            # real vault (name carries a suffix, e.g. -kv2) from Azure instead of
            # guessing.
            KEY_VAULT_NAME=$(az keyvault list -g "$WORKLOAD_RG" --query "[?starts_with(name, '${WORKLOAD_RG#rg-}-kv')].name | [0]" -o tsv 2>/dev/null || echo "")
            KEY_VAULT_NAME="${KEY_VAULT_NAME:-${WORKLOAD_RG#rg-}-kv}"
          fi
          if az keyvault show --name "$KEY_VAULT_NAME" --resource-group "$WORKLOAD_RG" --only-show-errors > /dev/null 2>&1; then
            RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
            if [ -n "$RUNNER_IP" ]; then
              az keyvault network-rule add --name "$KEY_VAULT_NAME" --resource-group "$WORKLOAD_RG" --ip-address "$RUNNER_IP" --only-show-errors > /dev/null
              # Firewall rule propagation is not immediate — wait until the data
              # plane accepts this runner or Terraform 403s (ForbiddenByFirewall).
              for i in $(seq 1 18); do
                if az keyvault secret list --vault-name "$KEY_VAULT_NAME" --maxresults 1 --only-show-errors -o none 2>/dev/null; then
                  echo "Key Vault data plane reachable from runner."
                  break
                fi
                if [ "$i" = "18" ]; then
                  echo "::warning::Key Vault $KEY_VAULT_NAME data plane still unreachable after ~3 minutes."
                else
                  sleep 10
                fi
              done
            fi
          else
            echo "Key Vault $KEY_VAULT_NAME does not exist yet; nothing to open."
          fi

      # The application storage account is deny-by-default too (storage module):
      # azurerm_storage_account_static_website is provisioned and refreshed over
      # the data plane, so this runner's public IP must be allow-listed while
      # Terraform runs, exactly as for Key Vault above. An account not yet in
      # state is created by Terraform with the IP in its ip_rules
      # (TF_VAR_deploy_runner_ip → workload variable deploy_runner_ip), so the
      # first apply can provision the static website too; ignore_changes keeps
      # the transient rule from fighting Terraform afterwards.
      - name: Ensure storage account is reachable during drift plan
        working-directory: infra/terraform/environments/dev/workload
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [ -z "$RUNNER_IP" ]; then
            echo "::warning::Could not determine the runner's public IP; storage data-plane calls may be refused by the firewall."
            exit 0
          fi
          echo "TF_VAR_deploy_runner_ip=$RUNNER_IP" >> "$GITHUB_ENV"
          STORAGE_ACCOUNT_NAME=$(terraform output -raw storage_account_name 2>/dev/null || echo "")
          if [ -z "$STORAGE_ACCOUNT_NAME" ]; then
            echo "Storage account not in state yet; Terraform creates it with this runner's IP allow-listed."
            exit 0
          fi
          STORAGE_ACCOUNT_RG=$(az storage account show --name "$STORAGE_ACCOUNT_NAME" --query resourceGroup -o tsv --only-show-errors 2>/dev/null || echo "")
          if [ -z "$STORAGE_ACCOUNT_RG" ]; then
            echo "Storage account $STORAGE_ACCOUNT_NAME is in state but not in Azure; Terraform will recreate it."
            exit 0
          fi
          echo "STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME" >> "$GITHUB_ENV"
          echo "STORAGE_ACCOUNT_RG=$STORAGE_ACCOUNT_RG" >> "$GITHUB_ENV"
          az storage account network-rule add --account-name "$STORAGE_ACCOUNT_NAME" --resource-group "$STORAGE_ACCOUNT_RG" --ip-address "$RUNNER_IP" --only-show-errors > /dev/null
          # Firewall rule propagation is not immediate — wait until the data
          # plane accepts this runner before Terraform touches it.
          for i in $(seq 1 18); do
            if az storage container list --account-name "$STORAGE_ACCOUNT_NAME" --auth-mode key --num-results 1 --only-show-errors -o none 2>/dev/null; then
              echo "Storage data plane reachable from runner."
              break
            fi
            if [ "$i" = "18" ]; then
              echo "::warning::Storage account $STORAGE_ACCOUNT_NAME data plane still unreachable after ~3 minutes."
            else
              sleep 10
            fi
          done

      - name: Terraform drift plan (workload)
        working-directory: infra/terraform/environments/dev/workload
        # Secrets passed via TF_VAR_* env so they never appear in the process
        # listing / logs (unlike -var= on the command line).
        env:
          # region_short has no default and is used by the workload root (name_prefix).
          TF_VAR_region_short: ${{ vars.AZURE_REGION_SHORT }}
          TF_VAR_postgres_admin_password: ${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_entra_client_secret: ${{ secrets.CNA_ENTRA_CLIENT_SECRET }}
          TF_VAR_nextauth_secret: ${{ secrets.CNA_NEXTAUTH_SECRET }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_container_registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          TF_VAR_credential_encryption_key: ${{ secrets.CNA_CREDENTIAL_ENCRYPTION_KEY }}
          TF_VAR_github_token: ""
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

          optional_var() {
            local VALUE="$1"
            if [[ -z "$VALUE" || "$VALUE" == "none" ]]; then
              echo ""
            else
              echo "$VALUE"
            fi
          }
          # Drift must be measured against what was actually deployed, not the
          # floating tags or the current repo variables: the release catalog
          # written by the deploy workflow is the source of truth for the image
          # references and the ai_mode this environment was applied with.
          CATALOG="$GITHUB_WORKSPACE/.deployment-catalog/dev/latest.json"
          catalog_value() {
            local KEY="$1" FALLBACK="$2"
            if [ -f "$CATALOG" ]; then
              local V
              V=$(jq -r "$KEY // empty" "$CATALOG")
              if [ -n "$V" ]; then echo "$V"; return; fi
            fi
            echo "$FALLBACK"
          }
          # Drift is measured against the pinned references the release catalog
          # actually recorded; there is no floating-tag fallback (T-701). A missing
          # image means drift cannot be measured, so fail loudly.
          API_IMAGE=$(catalog_value '.api_image' "")
          WORKER_IMAGE=$(catalog_value '.worker_image' "")
          WEB_IMAGE=$(catalog_value '.web_image' "")
          for pair in "api:${API_IMAGE}" "worker:${WORKER_IMAGE}" "web:${WEB_IMAGE}"; do
            ROLE="${pair%%:*}"
            VAL="${pair#*:}"
            if [ -z "$VAL" ]; then
              echo "::error::release catalog has no image for ${ROLE}; drift cannot be measured against a floating tag"
              exit 1
            fi
          done
          AI_MODE=$(catalog_value '.ai_mode' "saas")
          AI_ENGINE_DEFAULT=$(optional_var "${{ vars.CNA_AI_ENGINE_DEFAULT }}")
          if [ "$AI_MODE" = "byo-api" ]; then
            case "$AI_ENGINE_DEFAULT" in anthropic|openai) ;; *) AI_ENGINE_DEFAULT="anthropic" ;; esac
          else
            AI_ENGINE_DEFAULT="azure-openai"
          fi
          AZURE_MCP_ENDPOINT=$(optional_var "${{ vars.CNA_AZURE_MCP_ENDPOINT }}")
          AZURE_MCP_TRANSPORT=$(optional_var "${{ vars.CNA_AZURE_MCP_TRANSPORT }}")
          AWS_MCP_ENDPOINT=$(optional_var "${{ vars.CNA_AWS_MCP_ENDPOINT }}")
          AWS_MCP_TRANSPORT=$(optional_var "${{ vars.CNA_AWS_MCP_TRANSPORT }}")
          DRAWIO_MCP_URL=$(optional_var "${{ vars.CNA_DRAWIO_MCP_URL }}")
          FOUNDRY_PROJECT_ENDPOINT=$(optional_var "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}")
          FOUNDRY_RECOMMENDATION_AGENT_ID=$(optional_var "${{ vars.FOUNDRY_RECOMMENDATION_AGENT_ID }}")

          terraform plan -detailed-exitcode \
            -var="api_image=${API_IMAGE}" \
            -var="worker_image=${WORKER_IMAGE}" \
            -var="web_image=${WEB_IMAGE}" \
            -var="entra_client_id=${{ vars.CNA_ENTRA_CLIENT_ID }}" \
            -var="nextauth_url=${{ vars.CNA_NEXTAUTH_URL }}" \
            -var="container_registry_username=${{ vars.DOCKERHUB_NAMESPACE }}" \
            -var="ai_mode=${AI_MODE}" \
            -var="ai_engine_default=${AI_ENGINE_DEFAULT}" \
            -var="azure_mcp_endpoint=${AZURE_MCP_ENDPOINT}" \
            -var="azure_mcp_transport=${AZURE_MCP_TRANSPORT:-streamable-http}" \
            -var="aws_mcp_endpoint=${AWS_MCP_ENDPOINT}" \
            -var="aws_mcp_transport=${AWS_MCP_TRANSPORT:-streamable-http}" \
            -var="drawio_mcp_url=${DRAWIO_MCP_URL}" \
            -var="foundry_project_endpoint=${FOUNDRY_PROJECT_ENDPOINT}" \
            -var="foundry_recommendation_agent_id=${FOUNDRY_RECOMMENDATION_AGENT_ID}" \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repository=${{ github.repository }}" \
            || EXIT=$?
          if [ "${EXIT:-0}" -eq 2 ]; then
            echo "::warning::Drift detected in dev/workload state."
          elif [ "${EXIT:-0}" -ne 0 ]; then
            echo "::error::terraform plan failed for dev/workload (exit $EXIT)."
            exit "$EXIT"
          fi

      - name: Remove Runner IP from Key Vault
        if: always()
        env:
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          if [[ -n "$TFSTATE_RESOURCE_GROUP" && "$TFSTATE_RESOURCE_GROUP" == *-tfstate ]]; then
            WORKLOAD_RG="${TFSTATE_RESOURCE_GROUP%-tfstate}"
          else
            WORKLOAD_RG="rg-cna-dev-${REGION_SHORT}"
          fi
          # Trust the Terraform-maintained KEY_VAULT_NAME variable (the real name
          # carries a suffix), but only if it matches THIS environment's prefix —
          # the variable is repo-level and both env workloads write it (last
          # apply wins). Bare "-kv" is the pre-first-apply fallback.
          KEY_VAULT_NAME="${{ vars.KEY_VAULT_NAME }}"
          if [[ "$KEY_VAULT_NAME" != "${WORKLOAD_RG#rg-}-kv"* ]]; then
            # Variable missing or belongs to the other environment — resolve the
            # real vault (name carries a suffix, e.g. -kv2) from Azure instead of
            # guessing.
            KEY_VAULT_NAME=$(az keyvault list -g "$WORKLOAD_RG" --query "[?starts_with(name, '${WORKLOAD_RG#rg-}-kv')].name | [0]" -o tsv 2>/dev/null || echo "")
            KEY_VAULT_NAME="${KEY_VAULT_NAME:-${WORKLOAD_RG#rg-}-kv}"
          fi
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [ -n "$RUNNER_IP" ]; then
            az keyvault network-rule remove --name "$KEY_VAULT_NAME" --resource-group "$WORKLOAD_RG" --ip-address "$RUNNER_IP" --only-show-errors >/dev/null 2>&1 || true
          fi

      - name: Remove Runner IP from storage account
        if: always()
        working-directory: infra/terraform/environments/dev/workload
        run: |
          NAME="${STORAGE_ACCOUNT_NAME:-}"
          RG="${STORAGE_ACCOUNT_RG:-}"
          if [ -z "$NAME" ]; then
            # First apply of an environment: the account was created during this
            # run with the runner IP baked into ip_rules — resolve it from state.
            NAME=$(terraform output -raw storage_account_name 2>/dev/null || echo "")
            if [ -n "$NAME" ]; then
              RG=$(az storage account show --name "$NAME" --query resourceGroup -o tsv --only-show-errors 2>/dev/null || echo "")
            fi
          fi
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [ -n "$NAME" ] && [ -n "$RG" ] && [ -n "$RUNNER_IP" ]; then
            az storage account network-rule remove --account-name "$NAME" --resource-group "$RG" --ip-address "$RUNNER_IP" --only-show-errors >/dev/null 2>&1 || true
          fi

  # A failing drift check must reach a person (TODO.md T-105): GitHub only
  # e-mails the workflow author on a scheduled-run failure, which for a
  # bot-authored workflow is nobody. One issue per failure kind, deduplicated by
  # exact title, so a month of daily failures is one issue that gets staler and
  # louder — not thirty notifications; every further failure adds a comment.
  report-failure:
    needs: drift-detection
    if: ${{ always() && needs.drift-detection.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      FAILURE_KIND: ${{ needs.drift-detection.outputs.failure_kind }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OWNER: ${{ github.repository_owner }}
      WORKFLOW_NAME: ${{ github.workflow }}
    steps:
      - name: Open or update the failure issue
        run: |
          if [ "$FAILURE_KIND" = "missing-environment" ]; then
            TITLE="${WORKFLOW_NAME} — the dev environment does not exist"
            SUMMARY="The Terraform state backend or the state for **dev** is missing. The environment has been deleted out of band or was never deployed. This is **not drift**: the way back is a release through \`210 · Deploy\` (after \`000 · Bootstrap Backend\` if the backend itself is gone)."
          else
            TITLE="${WORKFLOW_NAME} — the drift check failed"
            SUMMARY="The drift check did not complete (a \`terraform init\`/\`plan\` error, an expired credential, a provider fault or similar), so drift for **dev** is currently **unknown**. Drift itself is reported as a warning in the run, never here."
          fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # --search is full-text; keep only the exact title.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Failed again at ${NOW}: ${RUN_URL}"
            echo "Updated issue #${EXISTING}."
            exit 0
          fi
          printf -v BODY '%s\n\n- **Workflow:** %s\n- **First failure seen:** %s\n- **Run:** %s\n\n%s\n' \
            "$SUMMARY" "$WORKFLOW_NAME" "$NOW" "$RUN_URL" \
            "Every further failure of this check adds a comment here until the issue is closed; close it once the check is green again. Do not resolve this by muting the check (\`TODO.md\` → T-105)."
          if ! gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --assignee "$OWNER"; then
            # An organization cannot be an assignee: open the issue unassigned rather than not at all.
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
