name: "210 · Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      api_image:
        description: API image reference
        required: false
        default: ""
        type: string
      worker_image:
        description: Worker image reference
        required: false
        default: ""
        type: string
      web_image:
        description: Web (Next.js) image reference
        required: false
        default: ""
        type: string
      migrator_image:
        description: "Migrator image reference (pinned reference docker.io/<ns>/cna:migrator-sha-<7>@sha256:<digest>)"
        required: false
        default: ""
        type: string
      previous_api_image:
        description: Previous API image reference for rollback operations
        required: false
        default: ""
        type: string
      previous_worker_image:
        description: Previous worker image reference for rollback operations
        required: false
        default: ""
        type: string
      previous_web_image:
        description: Previous web image reference for rollback operations
        required: false
        default: ""
        type: string
      # NOTE: GitHub caps workflow_dispatch at 10 inputs. previous_migrator_image
      # is therefore exposed on workflow_call only (below); a human rollback from
      # the dialog leaves the previous_*_image fields empty and
      # resolve_rollback_target.py recovers all four images — including the
      # migrator — from the release catalog archive.
      deploy_mode:
        description: Deployment mode
        required: true
        default: release
        type: choice
        options:
          - release
          - rollback
      ai_mode:
        description: "AI mode: saas = Foundry/Azure OpenAI provisioned by Terraform; byo-api = no cloud AI, admins enter Anthropic/OpenAI keys in the app"
        required: true
        default: saas
        type: choice
        options:
          - saas
          - byo-api
  # Same contract as workflow_dispatch so the appliance image-update workflow
  # (230) can run a full release without a human in the dialog. Booleans and
  # choices arrive as strings either way; every job reads `inputs.*`.
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      api_image:
        required: false
        default: ""
        type: string
      worker_image:
        required: false
        default: ""
        type: string
      web_image:
        required: false
        default: ""
        type: string
      migrator_image:
        description: "Migrator image reference (pinned reference docker.io/<ns>/cna:migrator-sha-<7>@sha256:<digest>)"
        required: false
        default: ""
        type: string
      previous_api_image:
        required: false
        default: ""
        type: string
      previous_worker_image:
        required: false
        default: ""
        type: string
      previous_web_image:
        required: false
        default: ""
        type: string
      previous_migrator_image:
        description: "Previous migrator image reference for rollback (pinned reference docker.io/<ns>/cna:migrator-sha-<7>@sha256:<digest>)"
        required: false
        default: ""
        type: string
      deploy_mode:
        required: false
        default: release
        type: string
      ai_mode:
        required: false
        default: saas
        type: string
      source_repo:
        description: Repository that published the build manifest (recorded in the deployment manifest)
        required: false
        default: ""
        type: string
      source_manifest_run_id:
        description: Build run id from latest-build.json (recorded in the deployment manifest)
        required: false
        default: ""
        type: string
permissions:
  actions: write
  contents: write
  id-token: write
  security-events: write
  attestations: write

concurrency:
  group: deploy-${{ inputs.environment || 'schedule' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  AZURE_MONITOR_HEALTH_THRESHOLD: "95"
  APP_INSIGHTS_SUCCESS_THRESHOLD: "0.99"
  CERTIFICATE_EXPIRY_DAYS_THRESHOLD: "30"
  CANARY_WEIGHT_PERCENT: "10"
  PRIMARY_WEIGHT_PERCENT: "90"
  EFFECTIVE_API_IMAGE: ""
  EFFECTIVE_WORKER_IMAGE: ""
  EFFECTIVE_WEB_IMAGE: ""
  EFFECTIVE_MIGRATOR_IMAGE: ""
  # Image signing (core TODO.md T-703): the exact Sigstore identity the core's
  # 200-build-images signs with — from this repository variable only, never from
  # the manifest, the dispatch payload or an input — the issuer every GitHub
  # Actions signer shares, and the cosign release that verifies them (keep in
  # step with the core's COSIGN_VERSION).
  IMAGE_SIGNING_IDENTITY: ${{ vars.IMAGE_SIGNING_IDENTITY }}
  SIGSTORE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_VERSION: v3.1.3
  # Bind untrusted/dispatch-supplied inputs to env once, workflow-wide, so no
  # run: block interpolates ${{ inputs.* }} into shell text (DEVOPS-001). Steps
  # reference the shell variables ($ENVIRONMENT, $AI_MODE, ...) instead.
  ENVIRONMENT: ${{ inputs.environment }}
  AI_MODE: ${{ inputs.ai_mode }}
  DEPLOY_MODE: ${{ inputs.deploy_mode }}
  SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
  SOURCE_MANIFEST_RUN_ID: ${{ inputs.source_manifest_run_id }}
  FOUNDRY_CHECK_STATUS: ${{ inputs.ai_mode == 'byo-api' && 'not_applicable' || 'required' }}
  AZURE_OPENAI_CHECK_STATUS: ${{ inputs.ai_mode == 'byo-api' && 'not_applicable' || 'out_of_band_optional' }}

jobs:
  policy-gates:
    if: inputs.environment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manage_diagnostic_settings: ${{ steps.alz_diag.outputs.manage_diagnostic_settings }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ inputs.environment }}/platform
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      # Deploy by digest: every image is a pinned reference supplied by the
      # caller — 230 · Image Update, the core's latest-build.json, or the
      # update-available issue. There are no defaults and floating tags are
      # refused; the same function (validate_image_ref) guards 220 and the plan
      # job below.
      - name: Resolve Docker Hub image defaults
        env:
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
          INPUT_MIGRATOR_IMAGE: ${{ inputs.migrator_image }}
          PREVIOUS_API_IMAGE: ${{ inputs.previous_api_image }}
          PREVIOUS_WORKER_IMAGE: ${{ inputs.previous_worker_image }}
          PREVIOUS_WEB_IMAGE: ${{ inputs.previous_web_image }}
          PREVIOUS_MIGRATOR_IMAGE: ${{ inputs.previous_migrator_image }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

          # Shared across both appliances (T-701) — keep byte-identical.
          # Validates a container image reference for a role. NS is the Docker Hub
          # namespace ($DOCKERHUB_NAMESPACE). Refuses floating/empty; accepts a
          # digest-pinned reference; accepts (with a warning) a tag-only reference;
          # refuses anything else (wrong namespace, wrong role, extra characters).
          validate_image_ref() {
            local ROLE="$1" REF="$2"
            local NS="${DOCKERHUB_NAMESPACE}"
            local PINNED="^docker\.io/${NS}/cna:${ROLE}-sha-[0-9a-f]{7}@sha256:[0-9a-f]{64}$"
            local TAG_ONLY="^docker\.io/${NS}/cna:${ROLE}-sha-[0-9a-f]{7}$"
            local HOWTO="get a pinned reference from 230 (Image Update), the core's .deployment-catalog/latest-build.json (images.${ROLE} + digests.${ROLE}), or the update-available issue"
            if [ -z "$REF" ]; then
              echo "::error::${ROLE} image reference is empty (floating references are refused); ${HOWTO}."
              return 1
            fi
            if [[ "$REF" == *-latest || "$REF" == *:latest ]]; then
              echo "::error::${ROLE} image reference '${REF}' is a floating tag (refused); ${HOWTO}."
              return 1
            fi
            if [[ "$REF" =~ $PINNED ]]; then
              return 0
            fi
            if [[ "$REF" =~ $TAG_ONLY ]]; then
              echo "::warning::${ROLE} image reference '${REF}' is a tag-only reference; digest not pinned."
              return 0
            fi
            echo "::error::${ROLE} image reference '${REF}' is not a valid pinned reference; ${HOWTO}."
            return 1
          }

          # workflow_dispatch has no previous_migrator_image input (ten-input
          # cap), so a rollback takes the migrator from the release-catalog
          # record that deployed previous_api_image unless the caller passed it.
          if [ "$DEPLOY_MODE" = "rollback" ] && [ -z "$PREVIOUS_MIGRATOR_IMAGE" ] && [ -n "$PREVIOUS_API_IMAGE" ]; then
            PREVIOUS_MIGRATOR_IMAGE=$(jq -r --arg a "$PREVIOUS_API_IMAGE" 'select(.api_image == $a) | .migrator_image // empty' \
              "$GITHUB_WORKSPACE"/.deployment-catalog/"$ENVIRONMENT"/*.json 2>/dev/null | head -1 || true)
          fi

          if [ "$DEPLOY_MODE" = "rollback" ]; then
            if [[ -z "$PREVIOUS_API_IMAGE" || -z "$PREVIOUS_WORKER_IMAGE" || -z "$PREVIOUS_WEB_IMAGE" || -z "$PREVIOUS_MIGRATOR_IMAGE" ]]; then
              echo "::error::Rollback requires previous_api_image, previous_worker_image and previous_web_image, plus a migrator: previous_migrator_image (workflow_call) or a release-catalog record under .deployment-catalog/<env>/ whose api_image matches previous_api_image. Copy the references from latest.json or a <run_id>.json archive."
              exit 1
            fi
            API_IMAGE="$PREVIOUS_API_IMAGE"
            WORKER_IMAGE="$PREVIOUS_WORKER_IMAGE"
            WEB_IMAGE="$PREVIOUS_WEB_IMAGE"
            MIGRATOR_IMAGE="$PREVIOUS_MIGRATOR_IMAGE"
          else
            API_IMAGE="$INPUT_API_IMAGE"
            WORKER_IMAGE="$INPUT_WORKER_IMAGE"
            WEB_IMAGE="$INPUT_WEB_IMAGE"
            MIGRATOR_IMAGE="$INPUT_MIGRATOR_IMAGE"
          fi
          validate_image_ref api "$API_IMAGE"
          validate_image_ref worker "$WORKER_IMAGE"
          validate_image_ref web "$WEB_IMAGE"
          validate_image_ref migrator "$MIGRATOR_IMAGE"
          {
            echo "EFFECTIVE_API_IMAGE=$API_IMAGE"
            echo "EFFECTIVE_WORKER_IMAGE=$WORKER_IMAGE"
            echo "EFFECTIVE_WEB_IMAGE=$WEB_IMAGE"
            echo "EFFECTIVE_MIGRATOR_IMAGE=$MIGRATOR_IMAGE"
          } >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target subscription
        env:
          VAR_TARGET_SUBSCRIPTION_NAME: ${{ vars.AZURE_TARGET_SUBSCRIPTION_NAME }}
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          SUB_NAME=$(az account show --query name -o tsv)
          EXPECTED_SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          EXPECTED_SUB_NAME="$VAR_TARGET_SUBSCRIPTION_NAME"

          if [[ -n "$EXPECTED_SUB_ID" && "$EXPECTED_SUB_ID" != "none" && "$EXPECTED_SUB_ID" != "$SUB_ID" ]]; then
            echo "::error::Authenticated to subscription $SUB_ID, but AZURE_SUBSCRIPTION_ID expects $EXPECTED_SUB_ID"
            exit 1
          fi

          if [[ -n "$EXPECTED_SUB_NAME" && "$EXPECTED_SUB_NAME" != "none" && "$EXPECTED_SUB_NAME" != "$SUB_NAME" ]]; then
            echo "::error::Authenticated to subscription '$SUB_NAME', but AZURE_TARGET_SUBSCRIPTION_NAME expects '$EXPECTED_SUB_NAME'"
            exit 1
          fi

      - name: Validate PostgreSQL password is set
        env:
          PG_PASSWORD: ${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}
        run: |
          if [ -z "$PG_PASSWORD" ]; then
            echo "::error::CNA_POSTGRES_ADMIN_PASSWORD secret is not set."
            exit 1
          fi
          if echo "$PG_PASSWORD" | grep -qP '[@:/?#%\[\]]'; then
            echo "::notice::CNA_POSTGRES_ADMIN_PASSWORD contains URL-special characters -- they will be percent-encoded by Terraform urlencode() in the connection string."
          fi
          echo "Password: OK"

      - name: Validate Docker Hub image pull access
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_NAMESPACE" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::DOCKERHUB_NAMESPACE and DOCKERHUB_TOKEN are required so Azure Container Apps can pull private Docker Hub images."
            exit 1
          fi

          echo "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_NAMESPACE" \
            --password-stdin

          for image in \
            "$EFFECTIVE_API_IMAGE" \
            "$EFFECTIVE_WORKER_IMAGE" \
            "$EFFECTIVE_WEB_IMAGE" \
            "$EFFECTIVE_MIGRATOR_IMAGE"; do
            echo "Checking $image"
            docker manifest inspect "$image" > /dev/null
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Shared across both appliances (T-703) — keep byte-identical. Every image
      # must carry a keyless signature and a SLSA provenance attestation from the
      # core's 200-build-images identity (IMAGE_SIGNING_IDENTITY); an unsigned or
      # foreign image stops the release here, before any plan. Runs right after
      # the pull-access step so cosign reuses its `docker login`.
      - name: Verify image signatures and provenance
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE"/scripts/ci/verify_image_signature.sh api      "$EFFECTIVE_API_IMAGE"
          "$GITHUB_WORKSPACE"/scripts/ci/verify_image_signature.sh worker   "$EFFECTIVE_WORKER_IMAGE"
          "$GITHUB_WORKSPACE"/scripts/ci/verify_image_signature.sh web      "$EFFECTIVE_WEB_IMAGE"
          "$GITHUB_WORKSPACE"/scripts/ci/verify_image_signature.sh migrator "$EFFECTIVE_MIGRATOR_IMAGE"

      - name: Resolve Terraform backend targets
        env:
          VAR_TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          VAR_TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          VAR_TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          echo "TFSTATE_RESOURCE_GROUP=${VAR_TFSTATE_RESOURCE_GROUP}" >> "$GITHUB_ENV"
          echo "TFSTATE_STORAGE_ACCOUNT=${VAR_TFSTATE_STORAGE_ACCOUNT}" >> "$GITHUB_ENV"
          echo "TFSTATE_CONTAINER=${VAR_TFSTATE_CONTAINER}" >> "$GITHUB_ENV"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=${ENVIRONMENT}.terraform.tfstate" \
            -backend-config="use_oidc=true"

          cd ../workload
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=${ENVIRONMENT}.workload.terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform validate
        run: |
          terraform validate
          cd ../workload
          terraform validate

      - name: Terraform IaC security scan (Checkov)
        run: |
          # Resolve the checkov entrypoint from its pipx venv directly, independent
          # of PATH. pipx installs into $PIPX_HOME (default ~/.local/share/pipx) and
          # symlinks to $PIPX_BIN_DIR (default ~/.local/bin), which is on PATH on
          # GitHub-hosted runners but not on every runner image. Querying pipx for
          # the venv path avoids hardcoding $HOME and works whoever the runner user is.
          pipx install checkov --force --quiet
          PIPX_BIN_DIR="$(pipx environment --value PIPX_BIN_DIR 2>/dev/null || echo "$HOME/.local/bin")"
          CHECKOV="$PIPX_BIN_DIR/checkov"
          if [ ! -x "$CHECKOV" ]; then
            echo "::error::checkov not found at $CHECKOV after pipx install"
            exit 1
          fi
          GATE="$GITHUB_WORKSPACE/policy-gates-${ENVIRONMENT}.json"
          CURATED_CHECKS="CKV_AZURE_236,CKV_AZURE_238,CKV_AZURE_134,CKV_AZURE_136,CKV_AZURE_189,CKV_AZURE_109,CKV_AZURE_41,CKV_AZURE_114,CKV_AZURE_206,CKV_AZURE_190,CKV_AZURE_59,CKV2_AZURE_38,CKV2_AZURE_31,CKV2_AZURE_47,CKV2_AZURE_40,CKV2_AZURE_41"
          "$CHECKOV" -d . --framework terraform --check "$CURATED_CHECKS" --output cli
          printf '{"status":"passed","blocking":true,"checks":"%s"}\n' "$CURATED_CHECKS" > "$GATE"
          cat "$GATE"

      # Pre-flight: detect an Azure Landing Zone DeployIfNotExists diagnostic-
      # settings policy governing this subscription. On a governed ALZ the policy
      # ships diagnostics centrally; our module dual-ships uniquely-named settings
      # with a stabilization delay. This step records the decision so a future
      # environment can stand our settings down entirely if ever required.
      - name: Detect ALZ diagnostic-settings governance
        id: alz_diag
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ALZ_DIAGNOSTICS_MANAGE: ${{ vars.ALZ_DIAGNOSTICS_MANAGE }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/detect_alz_diagnostic_policies.sh"

      - name: Upload policy gate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: policy-gates-${{ inputs.environment }}
          path: policy-gates-${{ inputs.environment }}.json

  plan:
    if: inputs.environment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: policy-gates
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ inputs.environment }}/platform
    # Expose the resolved (SHA-pinned) image references so the apply job can reuse
    # them. $GITHUB_ENV does not cross jobs, so without these outputs the apply
    # job's re-plan would see empty image vars and fail container-app validation.
    outputs:
      api_image: ${{ steps.resolve_images.outputs.api_image }}
      worker_image: ${{ steps.resolve_images.outputs.worker_image }}
      web_image: ${{ steps.resolve_images.outputs.web_image }}
      migrator_image: ${{ steps.resolve_images.outputs.migrator_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target subscription
        env:
          VAR_TARGET_SUBSCRIPTION_NAME: ${{ vars.AZURE_TARGET_SUBSCRIPTION_NAME }}
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          SUB_NAME=$(az account show --query name -o tsv)
          EXPECTED_SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          EXPECTED_SUB_NAME="$VAR_TARGET_SUBSCRIPTION_NAME"

          if [[ -n "$EXPECTED_SUB_ID" && "$EXPECTED_SUB_ID" != "none" && "$EXPECTED_SUB_ID" != "$SUB_ID" ]]; then
            echo "::error::Authenticated to subscription $SUB_ID, but AZURE_SUBSCRIPTION_ID expects $EXPECTED_SUB_ID"
            exit 1
          fi

          if [[ -n "$EXPECTED_SUB_NAME" && "$EXPECTED_SUB_NAME" != "none" && "$EXPECTED_SUB_NAME" != "$SUB_NAME" ]]; then
            echo "::error::Authenticated to subscription '$SUB_NAME', but AZURE_TARGET_SUBSCRIPTION_NAME expects '$EXPECTED_SUB_NAME'"
            exit 1
          fi

      - name: Verify Azure Resource Provider registration
        run: |
          # Provider registration is a subscription-level operation the RG-scoped
          # deploy identity cannot perform (REVIEW.md R-007) — registration is
          # asserted by workflow 100, not attempted here. It is durable
          # subscription state that survives environment teardowns, so verify it
          # read-only instead of calling `az provider register` and failing on
          # Microsoft.App/register/action.
          STATE=$(az provider show --namespace Microsoft.App --query registrationState -o tsv 2>/dev/null || echo "Unknown")
          echo "Microsoft.App registration state: $STATE"
          case "$STATE" in
            Registered|Registering)
              ;;
            Unknown)
              echo "::warning::Could not read Microsoft.App registration state with this identity; workflow 100 asserts registration — continuing."
              ;;
            *)
              echo "::error::Microsoft.App is not registered (state: $STATE) and the deploy identity cannot register it (R-007). Run once as subscription Owner: az provider register --namespace Microsoft.App"
              exit 1
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve rollback targets from release catalog
        if: inputs.deploy_mode == 'rollback' && (inputs.previous_api_image == '' || inputs.previous_worker_image == '' || inputs.previous_web_image == '')
        env:
          CATALOG_DIR: $GITHUB_WORKSPACE/.deployment-catalog/${{ inputs.environment }}
        run: python3 $GITHUB_WORKSPACE/scripts/ci/resolve_rollback_target.py

      - name: Resolve Terraform backend targets
        env:
          VAR_TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          VAR_TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          VAR_TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          echo "TFSTATE_RESOURCE_GROUP=${VAR_TFSTATE_RESOURCE_GROUP}" >> "$GITHUB_ENV"
          echo "TFSTATE_STORAGE_ACCOUNT=${VAR_TFSTATE_STORAGE_ACCOUNT}" >> "$GITHUB_ENV"
          echo "TFSTATE_CONTAINER=${VAR_TFSTATE_CONTAINER}" >> "$GITHUB_ENV"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=${ENVIRONMENT}.terraform.tfstate" \
            -backend-config="use_oidc=true"

          cd ../workload
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=${ENVIRONMENT}.workload.terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Ensure Key Vault is reachable during Terraform
        env:
          VAR_KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          if [[ -n "$TFSTATE_RESOURCE_GROUP" && "$TFSTATE_RESOURCE_GROUP" == *-tfstate ]]; then
            WORKLOAD_RG="${TFSTATE_RESOURCE_GROUP%-tfstate}"
          elif [[ -n "$REGION_SHORT" ]]; then
            WORKLOAD_RG="rg-cna-${ENVIRONMENT}-${REGION_SHORT}"
          else
            echo "::error::AZURE_REGION_SHORT is required when TFSTATE_RESOURCE_GROUP is not set."
            exit 1
          fi
          WORKLOAD_NAME_PREFIX="${WORKLOAD_RG#rg-}"
          # The vault name carries a suffix (key_vault_name_suffix, bumped after
          # soft-delete collisions), so never derive it bare — trust the
          # KEY_VAULT_NAME variable that Terraform itself maintains, but only if
          # it matches THIS environment's prefix: the variable is repo-level and
          # both env workloads write it (last apply wins), so a prod run could
          # otherwise be handed the dev vault name. Bare "-kv" is the bootstrap
          # fallback before the first apply, when the vault doesn't exist anyway.
          KEY_VAULT_NAME="$VAR_KEY_VAULT_NAME"
          if [[ "$KEY_VAULT_NAME" != "${WORKLOAD_NAME_PREFIX}-kv"* ]]; then
            # Variable missing or belongs to the other environment — resolve the
            # real vault (name carries a suffix, e.g. -kv2) from Azure instead of
            # guessing. Empty result = vault not created yet; step below no-ops.
            KEY_VAULT_NAME=$(az keyvault list -g "$WORKLOAD_RG" --query "[?starts_with(name, '${WORKLOAD_NAME_PREFIX}-kv')].name | [0]" -o tsv 2>/dev/null || echo "")
            KEY_VAULT_NAME="${KEY_VAULT_NAME:-${WORKLOAD_NAME_PREFIX}-kv}"
          fi

          if az keyvault show --name "$KEY_VAULT_NAME" --resource-group "$WORKLOAD_RG" --only-show-errors > /dev/null 2>&1; then
            RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
            az keyvault update \
              --name "$KEY_VAULT_NAME" \
              --resource-group "$WORKLOAD_RG" \
              --public-network-access Enabled \
              --default-action Deny \
              --bypass AzureServices \
              --only-show-errors > /dev/null
            if [ -n "$RUNNER_IP" ]; then
              az keyvault network-rule add \
                --name "$KEY_VAULT_NAME" \
                --resource-group "$WORKLOAD_RG" \
                --ip-address "$RUNNER_IP" \
                --only-show-errors > /dev/null
              # Firewall rule propagation is not immediate — without this wait
              # Terraform's first data-plane secret read still 403s
              # (ForbiddenByFirewall) from the IP the rule was just added for.
              for i in $(seq 1 18); do
                if az keyvault secret list --vault-name "$KEY_VAULT_NAME" --maxresults 1 --only-show-errors -o none 2>/dev/null; then
                  echo "Key Vault data plane reachable from runner."
                  break
                fi
                if [ "$i" = "18" ]; then
                  echo "::warning::Key Vault $KEY_VAULT_NAME data plane still unreachable after ~3 minutes; Terraform may fail with ForbiddenByFirewall."
                else
                  sleep 10
                fi
              done
            fi
          else
            echo "Key Vault $KEY_VAULT_NAME does not exist yet; Terraform will create it."
          fi

      # The application storage account is deny-by-default too (storage module):
      # azurerm_storage_account_static_website is provisioned and refreshed over
      # the data plane, so this runner's public IP must be allow-listed while
      # Terraform runs, exactly as for Key Vault above. An account not yet in
      # state is created by Terraform with the IP in its ip_rules
      # (TF_VAR_deploy_runner_ip → workload variable deploy_runner_ip), so the
      # first apply can provision the static website too; ignore_changes keeps
      # the transient rule from fighting Terraform afterwards.
      - name: Ensure storage account is reachable during Terraform
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [ -z "$RUNNER_IP" ]; then
            echo "::warning::Could not determine the runner's public IP; storage data-plane calls may be refused by the firewall."
            exit 0
          fi
          echo "TF_VAR_deploy_runner_ip=$RUNNER_IP" >> "$GITHUB_ENV"
          STORAGE_ACCOUNT_NAME=$(terraform output -raw storage_account_name 2>/dev/null || echo "")
          if [ -z "$STORAGE_ACCOUNT_NAME" ]; then
            echo "Storage account not in state yet; Terraform creates it with this runner's IP allow-listed."
            exit 0
          fi
          STORAGE_ACCOUNT_RG=$(az storage account show --name "$STORAGE_ACCOUNT_NAME" --query resourceGroup -o tsv --only-show-errors 2>/dev/null || echo "")
          if [ -z "$STORAGE_ACCOUNT_RG" ]; then
            echo "Storage account $STORAGE_ACCOUNT_NAME is in state but not in Azure; Terraform will recreate it."
            exit 0
          fi
          echo "STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME" >> "$GITHUB_ENV"
          echo "STORAGE_ACCOUNT_RG=$STORAGE_ACCOUNT_RG" >> "$GITHUB_ENV"
          az storage account network-rule add --account-name "$STORAGE_ACCOUNT_NAME" --resource-group "$STORAGE_ACCOUNT_RG" --ip-address "$RUNNER_IP" --only-show-errors > /dev/null
          # Firewall rule propagation is not immediate — wait until the data
          # plane accepts this runner before Terraform touches it.
          for i in $(seq 1 18); do
            if az storage container list --account-name "$STORAGE_ACCOUNT_NAME" --auth-mode key --num-results 1 --only-show-errors -o none 2>/dev/null; then
              echo "Storage data plane reachable from runner."
              break
            fi
            if [ "$i" = "18" ]; then
              echo "::warning::Storage account $STORAGE_ACCOUNT_NAME data plane still unreachable after ~3 minutes."
            else
              sleep 10
            fi
          done

      # $GITHUB_ENV does not cross jobs, so the plan job resolves the image set
      # again from the same inputs the policy gates validated: the four
      # *_image inputs for a release, the four previous_*_image inputs (or what
      # resolve_rollback_target.py read from the catalog) for a rollback. Every
      # reference is re-validated here — including the catalog's — and then
      # published as job outputs for the apply job. No build manifest is read:
      # the appliance never holds one; 230 / the core's latest-build.json /
      # the update-available issue supply the pinned references.
      - name: Resolve and validate image references
        id: resolve_images
        working-directory: ${{ github.workspace }}
        env:
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
          INPUT_MIGRATOR_IMAGE: ${{ inputs.migrator_image }}
          PREVIOUS_API_IMAGE: ${{ inputs.previous_api_image }}
          PREVIOUS_WORKER_IMAGE: ${{ inputs.previous_worker_image }}
          PREVIOUS_WEB_IMAGE: ${{ inputs.previous_web_image }}
          PREVIOUS_MIGRATOR_IMAGE: ${{ inputs.previous_migrator_image }}
        run: |
          set -euo pipefail
          # Shared across both appliances (T-701) — keep byte-identical.
          # Validates a container image reference for a role. NS is the Docker Hub
          # namespace ($DOCKERHUB_NAMESPACE). Refuses floating/empty; accepts a
          # digest-pinned reference; accepts (with a warning) a tag-only reference;
          # refuses anything else (wrong namespace, wrong role, extra characters).
          validate_image_ref() {
            local ROLE="$1" REF="$2"
            local NS="${DOCKERHUB_NAMESPACE}"
            local PINNED="^docker\.io/${NS}/cna:${ROLE}-sha-[0-9a-f]{7}@sha256:[0-9a-f]{64}$"
            local TAG_ONLY="^docker\.io/${NS}/cna:${ROLE}-sha-[0-9a-f]{7}$"
            local HOWTO="get a pinned reference from 230 (Image Update), the core's .deployment-catalog/latest-build.json (images.${ROLE} + digests.${ROLE}), or the update-available issue"
            if [ -z "$REF" ]; then
              echo "::error::${ROLE} image reference is empty (floating references are refused); ${HOWTO}."
              return 1
            fi
            if [[ "$REF" == *-latest || "$REF" == *:latest ]]; then
              echo "::error::${ROLE} image reference '${REF}' is a floating tag (refused); ${HOWTO}."
              return 1
            fi
            if [[ "$REF" =~ $PINNED ]]; then
              return 0
            fi
            if [[ "$REF" =~ $TAG_ONLY ]]; then
              echo "::warning::${ROLE} image reference '${REF}' is a tag-only reference; digest not pinned."
              return 0
            fi
            echo "::error::${ROLE} image reference '${REF}' is not a valid pinned reference; ${HOWTO}."
            return 1
          }

          # workflow_dispatch has no previous_migrator_image input (ten-input
          # cap), so a rollback takes the migrator from the release-catalog
          # record that deployed previous_api_image unless the caller passed it.
          if [ "$DEPLOY_MODE" = "rollback" ] && [ -z "$PREVIOUS_MIGRATOR_IMAGE" ] && [ -n "$PREVIOUS_API_IMAGE" ]; then
            PREVIOUS_MIGRATOR_IMAGE=$(jq -r --arg a "$PREVIOUS_API_IMAGE" 'select(.api_image == $a) | .migrator_image // empty' \
              "$GITHUB_WORKSPACE"/.deployment-catalog/"$ENVIRONMENT"/*.json 2>/dev/null | head -1 || true)
          fi

          if [ "$DEPLOY_MODE" = "rollback" ]; then
            # EFFECTIVE_* is already set when resolve_rollback_target.py ran.
            API_IMG="${EFFECTIVE_API_IMAGE:-$PREVIOUS_API_IMAGE}"
            WORKER_IMG="${EFFECTIVE_WORKER_IMAGE:-$PREVIOUS_WORKER_IMAGE}"
            WEB_IMG="${EFFECTIVE_WEB_IMAGE:-$PREVIOUS_WEB_IMAGE}"
            MIGRATOR_IMG="${EFFECTIVE_MIGRATOR_IMAGE:-$PREVIOUS_MIGRATOR_IMAGE}"
          else
            API_IMG="$INPUT_API_IMAGE"
            WORKER_IMG="$INPUT_WORKER_IMAGE"
            WEB_IMG="$INPUT_WEB_IMAGE"
            MIGRATOR_IMG="$INPUT_MIGRATOR_IMAGE"
          fi
          validate_image_ref api "$API_IMG"
          validate_image_ref worker "$WORKER_IMG"
          validate_image_ref web "$WEB_IMG"
          validate_image_ref migrator "$MIGRATOR_IMG"
          {
            echo "EFFECTIVE_API_IMAGE=${API_IMG}"
            echo "EFFECTIVE_WORKER_IMAGE=${WORKER_IMG}"
            echo "EFFECTIVE_WEB_IMAGE=${WEB_IMG}"
            echo "EFFECTIVE_MIGRATOR_IMAGE=${MIGRATOR_IMG}"
          } >> "$GITHUB_ENV"
          # Job outputs so the apply job (separate job, separate $GITHUB_ENV)
          # deploys exactly the references planned here.
          {
            echo "api_image=${API_IMG}"
            echo "worker_image=${WORKER_IMG}"
            echo "web_image=${WEB_IMG}"
            echo "migrator_image=${MIGRATOR_IMG}"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned images:"
          echo "  api:      ${API_IMG}"
          echo "  worker:   ${WORKER_IMG}"
          echo "  web:      ${WEB_IMG}"
          echo "  migrator: ${MIGRATOR_IMG}"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Platform = networking only (vnet, subnets, firewall). It declares no app
      # variables, so plan with defaults — passing app vars here would error with
      # "an argument named X is not expected here".
      #
      # Diagnostic settings: this subscription is a governed Azure Landing Zone, so
      # a DeployIfNotExists policy ('setByPolicy-*') owns diagnostics. Terraform
      # does NOT manage its own (module default manage_diagnostic_settings=false),
      # which avoids the azurerm create-race ("already exists / needs import") seen
      # on the firewall. We deliberately do NOT wire this to the policy-gates
      # pre-flight: that detection runs as the deploy SP, which cannot read the
      # management-group-scoped ALZ policy assignment, so it false-negatives and
      # would re-enable management. To manage diagnostics on a non-governed
      # subscription, set TF_VAR_manage_diagnostic_settings=true here explicitly.
      #
      # ai_mode is the one app-facing value the platform root does declare: in
      # byo-api it opens firewall egress to the bring-your-own AI providers.
      - name: Terraform plan (platform)
        run: terraform plan -out=tfplan -var="ai_mode=${AI_MODE}"

      # Workload = compute, database, identity, AI, Front Door. It owns every app
      # variable and secret. Secrets are passed via TF_VAR_* env (never -var on the
      # command line, which would leak into process listings / logs).
      # continue-on-error: greenfield deploys fail here because platform doesn't exist
      # yet. The apply job re-plans workload after platform apply, so this artifact is
      # only useful for incremental (day-2) drift-preview; a failure here is non-fatal.
      - name: Terraform plan (workload)
        continue-on-error: true
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        env:
          VAR_AI_ENGINE_DEFAULT: ${{ vars.CNA_AI_ENGINE_DEFAULT }}
          VAR_AWS_MCP_ENDPOINT: ${{ vars.CNA_AWS_MCP_ENDPOINT }}
          VAR_AWS_MCP_TRANSPORT: ${{ vars.CNA_AWS_MCP_TRANSPORT }}
          VAR_AZURE_MCP_ENDPOINT: ${{ vars.CNA_AZURE_MCP_ENDPOINT }}
          VAR_AZURE_MCP_TRANSPORT: ${{ vars.CNA_AZURE_MCP_TRANSPORT }}
          VAR_DRAWIO_MCP_URL: ${{ vars.CNA_DRAWIO_MCP_URL }}
          VAR_ENTRA_CLIENT_ID: ${{ vars.CNA_ENTRA_CLIENT_ID }}
          VAR_FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          VAR_FOUNDRY_RECOMMENDATION_AGENT_ID: ${{ vars.FOUNDRY_RECOMMENDATION_AGENT_ID }}
          VAR_NEXTAUTH_URL: ${{ vars.CNA_NEXTAUTH_URL }}
          TF_VAR_postgres_admin_password: ${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_entra_client_secret: ${{ secrets.CNA_ENTRA_CLIENT_SECRET }}
          TF_VAR_nextauth_secret: ${{ secrets.CNA_NEXTAUTH_SECRET }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_container_registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          TF_VAR_credential_encryption_key: ${{ secrets.CNA_CREDENTIAL_ENCRYPTION_KEY }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
        run: |
          optional_var() {
            local VALUE="$1"
            if [[ -z "$VALUE" || "$VALUE" == "none" ]]; then
              echo ""
            else
              echo "$VALUE"
            fi
          }
          # ai_engine_default must satisfy the Terraform cross-variable validation for
          # the selected ai_mode: saas => azure-openai, byo-api => anthropic|openai.
          # A repo variable that names an engine from the other mode is ignored.
          AI_MODE="${AI_MODE}"
          AI_ENGINE_DEFAULT=$(optional_var "$VAR_AI_ENGINE_DEFAULT")
          if [ "$AI_MODE" = "byo-api" ]; then
            case "$AI_ENGINE_DEFAULT" in anthropic|openai) ;; *) AI_ENGINE_DEFAULT="anthropic" ;; esac
          else
            AI_ENGINE_DEFAULT="azure-openai"
          fi
          AZURE_MCP_ENDPOINT=$(optional_var "$VAR_AZURE_MCP_ENDPOINT")
          AZURE_MCP_TRANSPORT=$(optional_var "$VAR_AZURE_MCP_TRANSPORT")
          AWS_MCP_ENDPOINT=$(optional_var "$VAR_AWS_MCP_ENDPOINT")
          AWS_MCP_TRANSPORT=$(optional_var "$VAR_AWS_MCP_TRANSPORT")
          DRAWIO_MCP_URL=$(optional_var "$VAR_DRAWIO_MCP_URL")
          FOUNDRY_PROJECT_ENDPOINT=$(optional_var "$VAR_FOUNDRY_PROJECT_ENDPOINT")
          FOUNDRY_RECOMMENDATION_AGENT_ID=$(optional_var "$VAR_FOUNDRY_RECOMMENDATION_AGENT_ID")
          SECRET_EXPIRY=$(date -u -d "+90 days" "+%Y-%m-%dT%H:%M:%SZ")

          terraform plan -out=tfplan \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repository=${GITHUB_REPOSITORY#*/}" \
            -var="api_image=${EFFECTIVE_API_IMAGE}" \
            -var="worker_image=${EFFECTIVE_WORKER_IMAGE}" \
            -var="web_image=${EFFECTIVE_WEB_IMAGE}" \
            -var="entra_client_id=${VAR_ENTRA_CLIENT_ID}" \
            -var="nextauth_url=${VAR_NEXTAUTH_URL}" \
            -var="container_registry_username=${DOCKERHUB_NAMESPACE}" \
            -var="ai_mode=${AI_MODE}" \
            -var="ai_engine_default=${AI_ENGINE_DEFAULT}" \
            -var="azure_mcp_endpoint=${AZURE_MCP_ENDPOINT}" \
            -var="azure_mcp_transport=${AZURE_MCP_TRANSPORT:-streamable-http}" \
            -var="aws_mcp_endpoint=${AWS_MCP_ENDPOINT}" \
            -var="aws_mcp_transport=${AWS_MCP_TRANSPORT:-streamable-http}" \
            -var="drawio_mcp_url=${DRAWIO_MCP_URL}" \
            -var="foundry_project_endpoint=${FOUNDRY_PROJECT_ENDPOINT}" \
            -var="foundry_recommendation_agent_id=${FOUNDRY_RECOMMENDATION_AGENT_ID}" \
            -var="secret_expiration_date=${SECRET_EXPIRY}"

      - name: Create deployment manifest
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.deployment-catalog/${ENVIRONMENT}"
          # Built with jq from env vars so no dispatch-supplied value is
          # interpolated into shell and the JSON is always well formed.
          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg deploy_mode "$DEPLOY_MODE" \
            --arg ai_mode "$AI_MODE" \
            --arg source_repo "$SOURCE_REPO" \
            --arg source_manifest_run_id "$SOURCE_MANIFEST_RUN_ID" \
            --arg api_image "$EFFECTIVE_API_IMAGE" \
            --arg worker_image "$EFFECTIVE_WORKER_IMAGE" \
            --arg web_image "$EFFECTIVE_WEB_IMAGE" \
            --arg migrator_image "$EFFECTIVE_MIGRATOR_IMAGE" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg foundry_check "$FOUNDRY_CHECK_STATUS" \
            --arg openai_check "$AZURE_OPENAI_CHECK_STATUS" \
            '{
              environment: $environment,
              deploy_mode: $deploy_mode,
              ai_mode: $ai_mode,
              source_repo: $source_repo,
              source_manifest_run_id: $source_manifest_run_id,
              api_image: $api_image,
              worker_image: $worker_image,
              web_image: $web_image,
              migrator_image: $migrator_image,
              commit_sha: $commit_sha,
              workflow_run_id: $workflow_run_id,
              approval_status: "pending",
              health_status: "unknown",
              validation_checks: {
                terraform_apply: "pending",
                post_deploy_probe: "pending",
                independent_verification: "pending",
                promotion_ready: "pending",
                external_health_validation: "pending",
                foundry_private_dns_validation: $foundry_check,
                foundry_managed_identity_inference: $foundry_check,
                azure_openai_provider_status: $openai_check,
                certificate_monitoring: "pending",
                canary_telemetry: "pending",
                staged_promotion: "pending",
                certificate_rotation: "pending"
              }
            }' > "$GITHUB_WORKSPACE/.deployment-catalog/${ENVIRONMENT}/deployment-manifest.json"

      - name: Terraform plan summary
        if: always()
        # Saved plan files are NOT uploaded as artifacts: a binary plan stores
        # every input variable value (DB password, client secrets, encryption
        # key) in plaintext (DEVOPS-002). The apply job re-plans anyway. Only the
        # human-readable `terraform show` output, which redacts sensitive values,
        # goes to the step summary.
        run: |
          {
            echo "## Terraform plan (${ENVIRONMENT})"
            echo "_Plan files are not uploaded; sensitive values below are redacted by terraform show. The apply job re-plans._"
            for layer in platform workload; do
              dir="infra/terraform/environments/${ENVIRONMENT}/${layer}"
              echo "<details><summary>${layer}</summary>"
              echo
              echo '```'
              if [ -f "${dir}/tfplan" ]; then
                terraform -chdir="${dir}" show -no-color tfplan 2>&1 || echo "(unable to render ${layer} plan)"
              else
                echo "(no ${layer} plan produced)"
              fi
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deployment-manifest-${{ inputs.environment }}
          path: .deployment-catalog/${{ inputs.environment }}/deployment-manifest.json

      - name: Remove Runner IP from Key Vault
        if: always()
        env:
          VAR_KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          VAR_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
          VAR_TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
        run: |
          REGION_SHORT=${VAR_REGION_SHORT}
          if [[ -n "$VAR_TFSTATE_RESOURCE_GROUP" && "$VAR_TFSTATE_RESOURCE_GROUP" == *-tfstate ]]; then
            WORKLOAD_RG="$VAR_TFSTATE_RESOURCE_GROUP"
            WORKLOAD_RG="${WORKLOAD_RG%-tfstate}"
          else
            WORKLOAD_RG="rg-cna-${ENVIRONMENT}-${REGION_SHORT}"
          fi
          # Trust the Terraform-maintained KEY_VAULT_NAME variable (the real name
          # carries a suffix), but only if it matches THIS environment's prefix —
          # the variable is repo-level and both env workloads write it (last
          # apply wins). Bare "-kv" is the pre-first-apply fallback.
          KEY_VAULT_NAME="$VAR_KEY_VAULT_NAME"
          if [[ "$KEY_VAULT_NAME" != "${WORKLOAD_RG#rg-}-kv"* ]]; then
            # Variable missing or belongs to the other environment — resolve the
            # real vault (name carries a suffix, e.g. -kv2) from Azure instead of
            # guessing.
            KEY_VAULT_NAME=$(az keyvault list -g "$WORKLOAD_RG" --query "[?starts_with(name, '${WORKLOAD_RG#rg-}-kv')].name | [0]" -o tsv 2>/dev/null || echo "")
            KEY_VAULT_NAME="${KEY_VAULT_NAME:-${WORKLOAD_RG#rg-}-kv}"
          fi
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [[ -n "$RUNNER_IP" ]]; then
            az keyvault network-rule remove --name "$KEY_VAULT_NAME" --resource-group "$WORKLOAD_RG" --ip-address "$RUNNER_IP" --only-show-errors >/dev/null 2>&1 || true
          fi

      - name: Remove Runner IP from storage account
        if: always()
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        run: |
          NAME="${STORAGE_ACCOUNT_NAME:-}"
          RG="${STORAGE_ACCOUNT_RG:-}"
          if [ -z "$NAME" ]; then
            # First apply of an environment: the account was created during this
            # run with the runner IP baked into ip_rules — resolve it from state.
            NAME=$(terraform output -raw storage_account_name 2>/dev/null || echo "")
            if [ -n "$NAME" ]; then
              RG=$(az storage account show --name "$NAME" --query resourceGroup -o tsv --only-show-errors 2>/dev/null || echo "")
            fi
          fi
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [ -n "$NAME" ] && [ -n "$RG" ] && [ -n "$RUNNER_IP" ]; then
            az storage account network-rule remove --account-name "$NAME" --resource-group "$RG" --ip-address "$RUNNER_IP" --only-show-errors >/dev/null 2>&1 || true
          fi

  apply:
    if: inputs.environment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan
    # Prod apply runs under the 'hub' environment, which has a required-reviewer
    # protection rule (manual approval gate) and a federated credential trusting
    # subject environment:hub on the Prod deploy SP. Dev applies under 'dev'.
    environment: ${{ inputs.environment == 'prod' && 'hub' || inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ inputs.environment }}/platform
    # $GITHUB_ENV does not cross jobs, so re-hydrate the resolved image references
    # from the plan job's outputs. Without this the post-platform re-plan below
    # passes empty image vars and container-app creation fails validation
    # ("template.0.container.0.image to not be an empty string").
    env:
      EFFECTIVE_API_IMAGE: ${{ needs.plan.outputs.api_image }}
      EFFECTIVE_WORKER_IMAGE: ${{ needs.plan.outputs.worker_image }}
      EFFECTIVE_WEB_IMAGE: ${{ needs.plan.outputs.web_image }}
      EFFECTIVE_MIGRATOR_IMAGE: ${{ needs.plan.outputs.migrator_image }}
    outputs:
      frontdoor_endpoint_host_name: ${{ steps.export.outputs.frontdoor_endpoint_host_name }}
      nextauth_url: ${{ steps.export.outputs.nextauth_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Resource Provider registration
        run: |
          # Provider registration is a subscription-level operation the RG-scoped
          # deploy identity cannot perform (REVIEW.md R-007) — registration is
          # asserted by workflow 100, not attempted here. It is durable
          # subscription state that survives environment teardowns, so verify it
          # read-only instead of calling `az provider register` and failing on
          # Microsoft.App/register/action.
          STATE=$(az provider show --namespace Microsoft.App --query registrationState -o tsv 2>/dev/null || echo "Unknown")
          echo "Microsoft.App registration state: $STATE"
          case "$STATE" in
            Registered|Registering)
              ;;
            Unknown)
              echo "::warning::Could not read Microsoft.App registration state with this identity; workflow 100 asserts registration — continuing."
              ;;
            *)
              echo "::error::Microsoft.App is not registered (state: $STATE) and the deploy identity cannot register it (R-007). Run once as subscription Owner: az provider register --namespace Microsoft.App"
              exit 1
              ;;
          esac

      # The DB-migration and revision-restart steps below use `az containerapp job`,
      # which lives in the containerapp CLI extension (NOT in core az). GitHub-hosted
      # runners ship the Azure CLI without it, so install it here every run; the
      # deploy must never die mid-apply with "unrecognized arguments: job".
      - name: Ensure az containerapp extension
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az extension add --name containerapp --upgrade --only-show-errors

      - name: Resolve Terraform backend targets
        env:
          VAR_TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          VAR_TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          VAR_TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          echo "TFSTATE_RESOURCE_GROUP=${VAR_TFSTATE_RESOURCE_GROUP}" >> "$GITHUB_ENV"
          echo "TFSTATE_STORAGE_ACCOUNT=${VAR_TFSTATE_STORAGE_ACCOUNT}" >> "$GITHUB_ENV"
          echo "TFSTATE_CONTAINER=${VAR_TFSTATE_CONTAINER}" >> "$GITHUB_ENV"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=${ENVIRONMENT}.terraform.tfstate" \
            -backend-config="use_oidc=true"

          cd ../workload
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=${ENVIRONMENT}.workload.terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Ensure Key Vault is reachable during Terraform
        env:
          VAR_KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          if [[ -n "$TFSTATE_RESOURCE_GROUP" && "$TFSTATE_RESOURCE_GROUP" == *-tfstate ]]; then
            WORKLOAD_RG="${TFSTATE_RESOURCE_GROUP%-tfstate}"
          elif [[ -n "$REGION_SHORT" ]]; then
            WORKLOAD_RG="rg-cna-${ENVIRONMENT}-${REGION_SHORT}"
          else
            echo "::error::AZURE_REGION_SHORT is required when TFSTATE_RESOURCE_GROUP is not set."
            exit 1
          fi
          WORKLOAD_NAME_PREFIX="${WORKLOAD_RG#rg-}"
          # The vault name carries a suffix (key_vault_name_suffix, bumped after
          # soft-delete collisions), so never derive it bare — trust the
          # KEY_VAULT_NAME variable that Terraform itself maintains, but only if
          # it matches THIS environment's prefix: the variable is repo-level and
          # both env workloads write it (last apply wins), so a prod run could
          # otherwise be handed the dev vault name. Bare "-kv" is the bootstrap
          # fallback before the first apply, when the vault doesn't exist anyway.
          KEY_VAULT_NAME="$VAR_KEY_VAULT_NAME"
          if [[ "$KEY_VAULT_NAME" != "${WORKLOAD_NAME_PREFIX}-kv"* ]]; then
            # Variable missing or belongs to the other environment — resolve the
            # real vault (name carries a suffix, e.g. -kv2) from Azure instead of
            # guessing. Empty result = vault not created yet; step below no-ops.
            KEY_VAULT_NAME=$(az keyvault list -g "$WORKLOAD_RG" --query "[?starts_with(name, '${WORKLOAD_NAME_PREFIX}-kv')].name | [0]" -o tsv 2>/dev/null || echo "")
            KEY_VAULT_NAME="${KEY_VAULT_NAME:-${WORKLOAD_NAME_PREFIX}-kv}"
          fi

          if az keyvault show --name "$KEY_VAULT_NAME" --resource-group "$WORKLOAD_RG" --only-show-errors > /dev/null 2>&1; then
            RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
            az keyvault update \
              --name "$KEY_VAULT_NAME" \
              --resource-group "$WORKLOAD_RG" \
              --public-network-access Enabled \
              --default-action Deny \
              --bypass AzureServices \
              --only-show-errors > /dev/null
            if [ -n "$RUNNER_IP" ]; then
              az keyvault network-rule add \
                --name "$KEY_VAULT_NAME" \
                --resource-group "$WORKLOAD_RG" \
                --ip-address "$RUNNER_IP" \
                --only-show-errors > /dev/null
              # Firewall rule propagation is not immediate — without this wait
              # Terraform's first data-plane secret read still 403s
              # (ForbiddenByFirewall) from the IP the rule was just added for.
              for i in $(seq 1 18); do
                if az keyvault secret list --vault-name "$KEY_VAULT_NAME" --maxresults 1 --only-show-errors -o none 2>/dev/null; then
                  echo "Key Vault data plane reachable from runner."
                  break
                fi
                if [ "$i" = "18" ]; then
                  echo "::warning::Key Vault $KEY_VAULT_NAME data plane still unreachable after ~3 minutes; Terraform may fail with ForbiddenByFirewall."
                else
                  sleep 10
                fi
              done
            fi
          else
            echo "Key Vault $KEY_VAULT_NAME does not exist yet; Terraform will create it."
          fi

      # The application storage account is deny-by-default too (storage module):
      # azurerm_storage_account_static_website is provisioned and refreshed over
      # the data plane, so this runner's public IP must be allow-listed while
      # Terraform runs, exactly as for Key Vault above. An account not yet in
      # state is created by Terraform with the IP in its ip_rules
      # (TF_VAR_deploy_runner_ip → workload variable deploy_runner_ip), so the
      # first apply can provision the static website too; ignore_changes keeps
      # the transient rule from fighting Terraform afterwards.
      - name: Ensure storage account is reachable during Terraform
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [ -z "$RUNNER_IP" ]; then
            echo "::warning::Could not determine the runner's public IP; storage data-plane calls may be refused by the firewall."
            exit 0
          fi
          echo "TF_VAR_deploy_runner_ip=$RUNNER_IP" >> "$GITHUB_ENV"
          STORAGE_ACCOUNT_NAME=$(terraform output -raw storage_account_name 2>/dev/null || echo "")
          if [ -z "$STORAGE_ACCOUNT_NAME" ]; then
            echo "Storage account not in state yet; Terraform creates it with this runner's IP allow-listed."
            exit 0
          fi
          STORAGE_ACCOUNT_RG=$(az storage account show --name "$STORAGE_ACCOUNT_NAME" --query resourceGroup -o tsv --only-show-errors 2>/dev/null || echo "")
          if [ -z "$STORAGE_ACCOUNT_RG" ]; then
            echo "Storage account $STORAGE_ACCOUNT_NAME is in state but not in Azure; Terraform will recreate it."
            exit 0
          fi
          echo "STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME" >> "$GITHUB_ENV"
          echo "STORAGE_ACCOUNT_RG=$STORAGE_ACCOUNT_RG" >> "$GITHUB_ENV"
          az storage account network-rule add --account-name "$STORAGE_ACCOUNT_NAME" --resource-group "$STORAGE_ACCOUNT_RG" --ip-address "$RUNNER_IP" --only-show-errors > /dev/null
          # Firewall rule propagation is not immediate — wait until the data
          # plane accepts this runner before Terraform touches it.
          for i in $(seq 1 18); do
            if az storage container list --account-name "$STORAGE_ACCOUNT_NAME" --auth-mode key --num-results 1 --only-show-errors -o none 2>/dev/null; then
              echo "Storage data plane reachable from runner."
              break
            fi
            if [ "$i" = "18" ]; then
              echo "::warning::Storage account $STORAGE_ACCOUNT_NAME data plane still unreachable after ~3 minutes."
            else
              sleep 10
            fi
          done

      # The plan job no longer uploads a tfplan artifact — a saved plan file
      # stores every variable value in plaintext (DEVOPS-002). Re-plan the
      # platform here so the apply below has a fresh, in-job plan; the destructive
      # -plan guard runs on it exactly as before. ai_mode is the only platform
      # variable; everything else is defaulted or workload-scoped.
      - name: Terraform plan (platform) — re-plan for apply
        run: terraform plan -out=tfplan -var="ai_mode=${AI_MODE}"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Applying a saved plan file (-out=tfplan) re-uses the variable values captured
      # at plan time, so no -var / TF_VAR_* are passed here — Terraform rejects vars
      # when applying a saved plan. Platform first (networking), then workload.
      # A release must never delete or replace the Log Analytics workspace, the
      # PostgreSQL server, the storage account or the Foundry account and its
      # model deployment: a stale state layout (TODO.md T-103) or a missing
      # `moved` block on the count-gated AI module (TODO.md T-101) would do
      # exactly that, and it deletes history and configuration no re-apply
      # brings back. Both saved plans are checked right before they are applied;
      # a human fixes state (state rm / import / moved) or knowingly lifts the
      # guard for one run.
      - name: Refuse a platform plan that destroys protected data
        env:
          PROTECTED_RESOURCE_TYPES: azurerm_log_analytics_workspace,azurerm_postgresql_flexible_server,azurerm_storage_account,azurerm_cognitive_account,azurerm_cognitive_deployment
          PLAN_LABEL: ${{ inputs.environment }}/platform
        run: terraform show -json tfplan | python3 "$GITHUB_WORKSPACE/scripts/ci/refuse_destructive_plan.py"

      - name: Terraform apply (platform)
        run: terraform apply -auto-approve tfplan

      # Workload is re-planned here (not from a pre-computed artifact) because on a
      # greenfield deploy the workload plan cannot succeed until platform exists.
      # The plan job's workload tfplan is only valid on incremental (day-2) runs where
      # platform infrastructure already exists. Re-planning after platform apply is
      # correct in both cases: greenfield and incremental.
      - name: Terraform plan (workload) — post-platform
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        env:
          VAR_AI_ENGINE_DEFAULT: ${{ vars.CNA_AI_ENGINE_DEFAULT }}
          VAR_AWS_MCP_ENDPOINT: ${{ vars.CNA_AWS_MCP_ENDPOINT }}
          VAR_AWS_MCP_TRANSPORT: ${{ vars.CNA_AWS_MCP_TRANSPORT }}
          VAR_AZURE_MCP_ENDPOINT: ${{ vars.CNA_AZURE_MCP_ENDPOINT }}
          VAR_AZURE_MCP_TRANSPORT: ${{ vars.CNA_AZURE_MCP_TRANSPORT }}
          VAR_DRAWIO_MCP_URL: ${{ vars.CNA_DRAWIO_MCP_URL }}
          VAR_ENTRA_CLIENT_ID: ${{ vars.CNA_ENTRA_CLIENT_ID }}
          VAR_FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          VAR_FOUNDRY_RECOMMENDATION_AGENT_ID: ${{ vars.FOUNDRY_RECOMMENDATION_AGENT_ID }}
          VAR_NEXTAUTH_URL: ${{ vars.CNA_NEXTAUTH_URL }}
          TF_VAR_postgres_admin_password: ${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_entra_client_secret: ${{ secrets.CNA_ENTRA_CLIENT_SECRET }}
          TF_VAR_nextauth_secret: ${{ secrets.CNA_NEXTAUTH_SECRET }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_container_registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          TF_VAR_credential_encryption_key: ${{ secrets.CNA_CREDENTIAL_ENCRYPTION_KEY }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
        run: |
          optional_var() {
            local VALUE="$1"
            if [[ -z "$VALUE" || "$VALUE" == "none" ]]; then
              echo ""
            else
              echo "$VALUE"
            fi
          }
          # ai_engine_default must satisfy the Terraform cross-variable validation for
          # the selected ai_mode: saas => azure-openai, byo-api => anthropic|openai.
          # A repo variable that names an engine from the other mode is ignored.
          AI_MODE="${AI_MODE}"
          AI_ENGINE_DEFAULT=$(optional_var "$VAR_AI_ENGINE_DEFAULT")
          if [ "$AI_MODE" = "byo-api" ]; then
            case "$AI_ENGINE_DEFAULT" in anthropic|openai) ;; *) AI_ENGINE_DEFAULT="anthropic" ;; esac
          else
            AI_ENGINE_DEFAULT="azure-openai"
          fi
          AZURE_MCP_ENDPOINT=$(optional_var "$VAR_AZURE_MCP_ENDPOINT")
          AZURE_MCP_TRANSPORT=$(optional_var "$VAR_AZURE_MCP_TRANSPORT")
          AWS_MCP_ENDPOINT=$(optional_var "$VAR_AWS_MCP_ENDPOINT")
          AWS_MCP_TRANSPORT=$(optional_var "$VAR_AWS_MCP_TRANSPORT")
          DRAWIO_MCP_URL=$(optional_var "$VAR_DRAWIO_MCP_URL")
          FOUNDRY_PROJECT_ENDPOINT=$(optional_var "$VAR_FOUNDRY_PROJECT_ENDPOINT")
          FOUNDRY_RECOMMENDATION_AGENT_ID=$(optional_var "$VAR_FOUNDRY_RECOMMENDATION_AGENT_ID")
          SECRET_EXPIRY=$(date -u -d "+90 days" "+%Y-%m-%dT%H:%M:%SZ")

          terraform plan -out=tfplan \
            -var="github_owner=${{ github.repository_owner }}" \
            -var="github_repository=${GITHUB_REPOSITORY#*/}" \
            -var="api_image=${EFFECTIVE_API_IMAGE}" \
            -var="worker_image=${EFFECTIVE_WORKER_IMAGE}" \
            -var="web_image=${EFFECTIVE_WEB_IMAGE}" \
            -var="entra_client_id=${VAR_ENTRA_CLIENT_ID}" \
            -var="nextauth_url=${VAR_NEXTAUTH_URL}" \
            -var="container_registry_username=${DOCKERHUB_NAMESPACE}" \
            -var="ai_mode=${AI_MODE}" \
            -var="ai_engine_default=${AI_ENGINE_DEFAULT}" \
            -var="azure_mcp_endpoint=${AZURE_MCP_ENDPOINT}" \
            -var="azure_mcp_transport=${AZURE_MCP_TRANSPORT:-streamable-http}" \
            -var="aws_mcp_endpoint=${AWS_MCP_ENDPOINT}" \
            -var="aws_mcp_transport=${AWS_MCP_TRANSPORT:-streamable-http}" \
            -var="drawio_mcp_url=${DRAWIO_MCP_URL}" \
            -var="foundry_project_endpoint=${FOUNDRY_PROJECT_ENDPOINT}" \
            -var="foundry_recommendation_agent_id=${FOUNDRY_RECOMMENDATION_AGENT_ID}" \
            -var="secret_expiration_date=${SECRET_EXPIRY}"

      - name: Refuse a workload plan that destroys protected data
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        env:
          PROTECTED_RESOURCE_TYPES: azurerm_log_analytics_workspace,azurerm_postgresql_flexible_server,azurerm_storage_account,azurerm_cognitive_account,azurerm_cognitive_deployment
          PLAN_LABEL: ${{ inputs.environment }}/workload
        run: terraform show -json tfplan | python3 "$GITHUB_WORKSPACE/scripts/ci/refuse_destructive_plan.py"

      - name: Terraform apply (workload)
        id: tf_apply
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        run: terraform apply -auto-approve tfplan

      - name: Export resource IDs for approval and evidence
        id: export_ids
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        run: |
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "container_app_environment_id=$(terraform output -raw container_app_environment_id)" >> "$GITHUB_OUTPUT"
          echo "web_container_app_name=$(terraform output -raw web_name)" >> "$GITHUB_OUTPUT"
          echo "private_endpoint_subnet_prefix=$(terraform output -raw private_endpoint_subnet_prefix)" >> "$GITHUB_OUTPUT"
          echo "database_server_name=$(terraform output -raw database_server_name)" >> "$GITHUB_OUTPUT"
          echo "database_server_fqdn=$(terraform output -raw database_server_fqdn)" >> "$GITHUB_OUTPUT"
          echo "database_subnet_prefix=$(terraform output -raw database_subnet_prefix)" >> "$GITHUB_OUTPUT"

      # Runs even when the apply fails: a partial apply can still have created
      # the Front Door origin, whose AFD-managed private endpoint request then
      # sits Pending on the Container Apps environment. Without this always()
      # the approval only ever ran after a fully successful apply, so one
      # transient origin failure left the request Pending forever and every
      # retry inherited the stuck half-state (observed 2026-07-01: origin
      # InternalError + Pending private link + origin present in Azure but
      # absent from Terraform state). On a failed apply the step derives the
      # environment from az (Terraform outputs may not exist yet) and tolerates
      # finding no request at all.
      - name: Approve Front Door private endpoint connections
        id: approve_private_link
        if: always() && steps.tf_apply.outcome != 'skipped'
        env:
          MANAGED_ENV_ID: ${{ steps.export_ids.outputs.container_app_environment_id }}
          RESOURCE_GROUP_NAME: ${{ steps.export_ids.outputs.resource_group_name }}
          REQUEST_DESCRIPTION: Azure Front Door Private Link request for CNA web origin
          MAX_ATTEMPTS: ${{ steps.tf_apply.outcome == 'success' && '30' || '3' }}
          SLEEP_SECONDS: "20"
          TOLERATE_MISSING: ${{ steps.tf_apply.outcome == 'success' && 'false' || 'true' }}
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          if [[ -z "$RESOURCE_GROUP_NAME" ]]; then
            if [[ -n "$TFSTATE_RESOURCE_GROUP" && "$TFSTATE_RESOURCE_GROUP" == *-tfstate ]]; then
              RESOURCE_GROUP_NAME="${TFSTATE_RESOURCE_GROUP%-tfstate}"
            else
              RESOURCE_GROUP_NAME="rg-cna-${ENVIRONMENT}-${REGION_SHORT}"
            fi
            export RESOURCE_GROUP_NAME
          fi
          if [[ -z "$MANAGED_ENV_ID" ]]; then
            MANAGED_ENV_NAME=$(az containerapp env list -g "$RESOURCE_GROUP_NAME" --query "[0].name" -o tsv 2>/dev/null || echo "")
            if [[ -z "$MANAGED_ENV_NAME" ]]; then
              echo "No Container Apps environment found in $RESOURCE_GROUP_NAME; nothing to approve."
              exit 0
            fi
            export MANAGED_ENV_NAME
          fi
          bash ${{ github.workspace }}/scripts/ci/approve_frontdoor_private_link.sh

      - name: Resolve migrator image from deployment manifest
        id: resolve_migrator
        run: |
          MANIFEST="$GITHUB_WORKSPACE/.deployment-catalog/${ENVIRONMENT}/deployment-manifest.json"
          mkdir -p "$(dirname "$MANIFEST")"

      - name: Download deployment manifest for migrator image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: deployment-manifest-${{ inputs.environment }}
          path: .deployment-catalog/${{ inputs.environment }}

      - name: Validate and export migrator image
        id: migrator_image
        run: |
          MANIFEST="$GITHUB_WORKSPACE/.deployment-catalog/${ENVIRONMENT}/deployment-manifest.json"
          IMAGE=$(jq -r '.migrator_image // empty' "$MANIFEST" 2>/dev/null || echo "")
          echo "Resolved migrator image from manifest: '${IMAGE}'"
          if [[ -z "$IMAGE" ]]; then
            echo "::error::migrator_image is empty in deployment manifest. The plan job must populate it."
            exit 1
          fi
          if [[ "$IMAGE" == *"quickstart"* || "$IMAGE" == *"k8se"* ]]; then
            echo "::error::migrator_image resolved to a placeholder image ('$IMAGE'). Supply the pinned migrator_image input (230 passes it; the core's latest-build.json has images.migrator + digests.migrator)."
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "MIGRATOR_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Wait for PostgreSQL server to be Ready
        env:
          DATABASE_SERVER_NAME: ${{ steps.export_ids.outputs.database_server_name }}
          RESOURCE_GROUP_NAME: ${{ steps.export_ids.outputs.resource_group_name }}
        run: |
          DB_SERVER="${DATABASE_SERVER_NAME}"
          RG="${RESOURCE_GROUP_NAME}"
          echo "Waiting for $DB_SERVER to reach Ready state (DNS re-registration after zone update)..."
          for i in $(seq 1 36); do
            STATE=$(az postgres flexible-server show \
              --name "$DB_SERVER" --resource-group "$RG" \
              --query "state" -o tsv 2>/dev/null || echo "Unknown")
            echo "  [$i/36] state: $STATE"
            if [ "$STATE" = "Ready" ]; then
              echo "Server is Ready — waiting 30s for DNS hash record to propagate..."
              sleep 30
              break
            fi
            [ $i -lt 36 ] && sleep 10 || { echo "::error::Timed out waiting for server Ready"; exit 1; }
          done

      - name: Run database migrations
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        # The connectivity probe's job manifest pulls the migrator image with these;
        # they were referenced but never defined, so the (best-effort) probe never ran.
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          RESOURCE_GROUP_NAME: ${{ steps.export_ids.outputs.resource_group_name }}
          CONTAINER_APP_ENVIRONMENT_ID: ${{ steps.export_ids.outputs.container_app_environment_id }}
          MIGRATOR_IMAGE_OUT: ${{ steps.migrator_image.outputs.image }}
        run: |
          DB_URL=$(terraform output -raw database_connection_string)
          # Empty when the break-glass local admin secret hasn't been bootstrapped
          # for this environment yet — the seed step in the migrator image no-ops
          # in that case, so this is safe to leave empty.
          LOCAL_ADMIN_PASSWORD_HASH=$(terraform output -raw local_admin_password 2>/dev/null || true)
          RG="${RESOURCE_GROUP_NAME}"
          CAE_ID="${CONTAINER_APP_ENVIRONMENT_ID}"
          CAE="${CAE_ID##*/}"
          DB_HOST=$(echo "$DB_URL" | sed 's|.*@||' | cut -d: -f1)
          MIGRATOR_IMAGE="${MIGRATOR_IMAGE_OUT}"

          echo "Migrator image: $MIGRATOR_IMAGE"
          if [[ -z "$MIGRATOR_IMAGE" || "$MIGRATOR_IMAGE" == *"quickstart"* || "$MIGRATOR_IMAGE" == *"k8se"* ]]; then
            echo "::error::Refusing to run migration with image '$MIGRATOR_IMAGE' — resolve step must have failed."
            exit 1
          fi

          # Probe connectivity from inside the VNet before committing to the full 300s job.
          # az job create --command/--args cannot pass a "-c" array element — its
          # argparse reads it as an unknown flag — so the entrypoint is supplied via
          # a YAML manifest where command/args are plain list items. The manifest is
          # built line-by-line (not a heredoc) so the workflow's run-block indentation
          # never leaks into the generated file's top-level YAML keys.
          PROBE_JOB="job-probe-${{ github.run_id }}"
          PROBE_YAML="$(mktemp)"
          {
            echo "properties:"
            echo "  environmentId: \"${CAE_ID}\""
            echo "  configuration:"
            echo "    triggerType: Manual"
            echo "    replicaTimeout: 30"
            echo "    replicaRetryLimit: 0"
            echo "    manualTriggerConfig:"
            echo "      replicaCompletionCount: 1"
            echo "      parallelism: 1"
            echo "    registries:"
            echo "    - server: docker.io"
            echo "      username: \"${DOCKERHUB_USERNAME}\""
            echo "      passwordSecretRef: dockerhub-password"
            echo "    secrets:"
            echo "    - name: dockerhub-password"
            echo "      value: \"${DOCKERHUB_PASSWORD}\""
            echo "  template:"
            echo "    containers:"
            echo "    - image: \"${MIGRATOR_IMAGE}\""
            echo "      name: \"${PROBE_JOB}\""
            echo "      command:"
            echo "      - /bin/sh"
            echo "      args:"
            echo "      - -c"
            # Probe the DB port without depending on nc/nslookup, which are absent
            # from minimal (Alpine/distroless) migrator images. Use Python (present
            # in the migrator image, which runs Alembic) to open a TCP socket — no
            # external probe tools required. Best-effort/informational; the migrate
            # job itself is the real gate, so this never blocks the deploy.
            echo "      - 'python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(5); sys.exit(s.connect_ex((\\\"${DB_HOST}\\\",5432)))\" && echo DB_REACHABLE || echo DB_UNREACHABLE'"
            echo "      resources:"
            echo "        cpu: 0.25"
            echo "        memory: 0.5Gi"
          } > "$PROBE_YAML"
          az containerapp job create --name "$PROBE_JOB" --resource-group "$RG" --yaml "$PROBE_YAML" 2>/dev/null || true
          rm -f "$PROBE_YAML"
          az containerapp job start --name "$PROBE_JOB" --resource-group "$RG" 2>/dev/null || true
          sleep 40
          LAW_ID=$(az monitor log-analytics workspace list -g "$RG" --query '[0].customerId' -o tsv 2>/dev/null || echo "")
          if [ -n "$LAW_ID" ]; then
            PROBE_LOG=$(az monitor log-analytics query -w "$LAW_ID" \
              --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(3m) | where ContainerAppName_s startswith 'job-probe' | order by TimeGenerated desc | take 20 | project Log_s" \
              -o tsv 2>/dev/null || echo "probe-log-unavailable")
          else
            PROBE_LOG="log-analytics-workspace-not-found"
          fi
          echo "Probe output: $PROBE_LOG"
          az containerapp job delete --name "$PROBE_JOB" --resource-group "$RG" --yes 2>/dev/null || true

          JOB="job-migrate-${{ github.run_id }}"
          echo "Creating migration job $JOB with image $MIGRATOR_IMAGE..."

          MIGRATE_SECRETS="db-url=$DB_URL"
          MIGRATE_ENV_VARS="DATABASE_URL=secretref:db-url"
          if [ -n "$LOCAL_ADMIN_PASSWORD_HASH" ]; then
            MIGRATE_SECRETS="$MIGRATE_SECRETS local-admin-password=$LOCAL_ADMIN_PASSWORD_HASH"
            MIGRATE_ENV_VARS="$MIGRATE_ENV_VARS LOCAL_ADMIN_PASSWORD=secretref:local-admin-password"
          fi

          az containerapp job create \
            --name "$JOB" \
            --resource-group "$RG" \
            --environment "$CAE" \
            --trigger-type Manual \
            --replica-timeout 300 \
            --replica-retry-limit 1 \
            --replica-completion-count 1 \
            --parallelism 1 \
            --image "$MIGRATOR_IMAGE" \
            --secrets $MIGRATE_SECRETS \
            --env-vars $MIGRATE_ENV_VARS \
            --registry-server "docker.io" \
            --registry-username "$DOCKERHUB_NAMESPACE" \
            --registry-password "${{ secrets.DOCKERHUB_TOKEN }}"
          echo "Starting migration..."
          az containerapp job start --name "$JOB" --resource-group "$RG"
          echo "Waiting for completion..."
          MIGRATION_STATUS="Running"
          EXEC_NAME=""
          for i in $(seq 1 30); do
            EXEC_JSON=$(az containerapp job execution list --name "$JOB" --resource-group "$RG" \
              --query "[-1]" -o json 2>/dev/null || echo "{}")
            STATUS=$(echo "$EXEC_JSON" | jq -r '.properties.status // "Running"')
            EXEC_NAME=$(echo "$EXEC_JSON" | jq -r '.name // ""')
            MIGRATION_STATUS="$STATUS"
            echo "  [$i/30] Status: $STATUS"
            case "$STATUS" in
              Succeeded) echo "Migrations succeeded."; break ;;
              Failed|Stopped)
                echo "Migration failed — capturing logs before cleanup..."
                if [ -n "$LAW_ID" ] && [ -n "$EXEC_NAME" ]; then
                  az monitor log-analytics query -w "$LAW_ID" \
                    --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(10m) | where ContainerAppName_s == '${JOB}' | order by TimeGenerated asc | project TimeGenerated, Log_s" \
                    -o table 2>/dev/null || echo "log-query-unavailable"
                fi
                az containerapp job delete --name "$JOB" --resource-group "$RG" --yes 2>/dev/null || true
                exit 1
                ;;
            esac
            [ $i -lt 30 ] && sleep 10 || echo "Timed out waiting for migration"
          done
          if [ -n "$LAW_ID" ] && [ "$MIGRATION_STATUS" != "Succeeded" ]; then
            echo "Migration timed out — capturing logs..."
            az monitor log-analytics query -w "$LAW_ID" \
              --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(10m) | where ContainerAppName_s == '${JOB}' | order by TimeGenerated asc | project TimeGenerated, Log_s" \
              -o table 2>/dev/null || echo "log-query-unavailable"
          fi
          az containerapp job delete --name "$JOB" --resource-group "$RG" --yes 2>/dev/null || true
          if [ "$MIGRATION_STATUS" != "Succeeded" ]; then
            echo "::error::Migration job did not complete successfully. Final status: $MIGRATION_STATUS"
            exit 1
          fi

      - name: Restart Container App revisions to pick up updated secrets
        # Key Vault references auto-refresh within 30 minutes when a new secret
        # version is created. This restart provides immediate pickup within the
        # same CI run. No min-replicas manipulation needed — scale-to-zero is
        # unaffected and there is no Terraform drift to restore.
        env:
          RESOURCE_GROUP_NAME: ${{ steps.export_ids.outputs.resource_group_name }}
          WEB_CONTAINER_APP_NAME: ${{ steps.export_ids.outputs.web_container_app_name }}
        run: |
          RG="${RESOURCE_GROUP_NAME}"
          WEB_APP="${WEB_CONTAINER_APP_NAME}"
          API_APP="${WEB_APP/-ca-web/-ca-api}"

          for APP in "$WEB_APP" "$API_APP"; do
            REV=$(az containerapp show --name "$APP" --resource-group "$RG" \
              --query "properties.latestRevisionName" -o tsv 2>/dev/null || echo "")
            if [[ -n "$REV" ]]; then
              echo "Restarting $APP revision $REV..."
              az containerapp revision restart --name "$APP" --resource-group "$RG" --revision "$REV" 2>/dev/null \
                || echo "::warning::Could not restart $APP $REV — KV auto-refresh will pick up changes within 30 min."
            fi
          done

      - name: Report NextAuth redirect URI (managed out-of-band)
        # The NextAuth redirect URI is set on the NextAuth APP OBJECT by the
        # Graph-capable bootstrap (scripts/Initialize-CnaGitHubSecrets.ps1), which
        # owns that app. The deploy identities are least-privilege and intentionally
        # have NO Microsoft Graph app-management rights, so the deploy does not (and
        # must not) call `az ad app update`. Microsoft guidance: redirect URIs belong
        # on the application object, never on a service principal. See docs/adr/0003.
        #
        # Terraform already writes the real Front Door host to the CNA_NEXTAUTH_URL
        # repository variable; re-running the bootstrap applies the redirect URI from
        # it (idempotent). This step only surfaces the value for operators.
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        run: |
          FRONTDOOR_HOST=$(terraform output -raw frontdoor_endpoint_host_name 2>/dev/null || echo "")
          if [ -z "$FRONTDOOR_HOST" ]; then
            echo "No Front Door hostname yet; nothing to report."
            exit 0
          fi
          echo "NextAuth redirect URI for the 'CNA Assessment Tool' Entra app:"
          echo "  https://${FRONTDOOR_HOST}/api/auth/callback/microsoft-entra-id"
          echo "Ensure it is present on the NextAuth app (managed by the bootstrap script)."

      - name: Export platform outputs
        id: export
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        run: |
          FRONTDOOR_HOST=$(terraform output -raw frontdoor_endpoint_host_name)
          echo "frontdoor_endpoint_host_name=$FRONTDOOR_HOST" >> "$GITHUB_OUTPUT"
          echo "nextauth_url=https://$FRONTDOOR_HOST" >> "$GITHUB_OUTPUT"
          echo "frontdoor_profile_id=$(terraform output -raw frontdoor_profile_id)" >> "$GITHUB_OUTPUT"
          echo "frontdoor_endpoint_id=$(terraform output -raw frontdoor_endpoint_id)" >> "$GITHUB_OUTPUT"
          echo "frontdoor_origin_group_id=$(terraform output -raw frontdoor_origin_group_id)" >> "$GITHUB_OUTPUT"
          echo "frontdoor_route_id=$(terraform output -raw frontdoor_route_id)" >> "$GITHUB_OUTPUT"
          echo "frontdoor_custom_domain_id=$(terraform output -raw frontdoor_custom_domain_id 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
          echo "frontdoor_secret_id=$(terraform output -raw frontdoor_secret_id 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Download deployment manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: deployment-manifest-${{ inputs.environment }}
          path: .deployment-catalog/${{ inputs.environment }}

      - name: Resolve workload naming
        env:
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          if [[ -n "$TFSTATE_RESOURCE_GROUP" && "$TFSTATE_RESOURCE_GROUP" == *-tfstate ]]; then
            WORKLOAD_RG="${TFSTATE_RESOURCE_GROUP%-tfstate}"
          elif [[ -n "$REGION_SHORT" ]]; then
            WORKLOAD_RG="rg-cna-${ENVIRONMENT}-${REGION_SHORT}"
          else
            echo "::error::AZURE_REGION_SHORT is required when TFSTATE_RESOURCE_GROUP is not set."
            exit 1
          fi

          echo "WORKLOAD_RG=$WORKLOAD_RG" >> "$GITHUB_ENV"
          echo "WORKLOAD_NAME_PREFIX=${WORKLOAD_RG#rg-}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The two AI Foundry markers in the manifest ("foundry_private_dns_validation",
      # "foundry_managed_identity_inference") were hardcoded `required` and nothing
      # ever flipped them, so a green run reported healthy on a path nobody had
      # exercised (TODO.md T-104). This step exercises it: a one-off Container
      # Apps Job in the same environment, with the same user-assigned identity and
      # the same api image as cna-api, runs scripts/ci/probe_foundry_path.py — it
      # resolves the Foundry host from inside the VNet (the answer must fall in the
      # private-endpoint subnet) and makes one managed-identity chat completion
      # against the deployment the api is configured with. The verdicts reach the
      # manifest through "Update apply evidence"; the verify job's evaluator then
      # refuses to call the deployment healthy unless both passed. This step never
      # fails the apply itself — the evidence is the verdict.
      - name: Verify the AI Foundry path from inside the environment
        id: ai_path
        if: inputs.ai_mode == 'saas'
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          RESOURCE_GROUP_NAME: ${{ steps.export_ids.outputs.resource_group_name }}
          CONTAINER_APP_ENVIRONMENT_ID: ${{ steps.export_ids.outputs.container_app_environment_id }}
          PRIVATE_ENDPOINT_SUBNET_PREFIX: ${{ steps.export_ids.outputs.private_endpoint_subnet_prefix }}
          WEB_CONTAINER_APP_NAME: ${{ steps.export_ids.outputs.web_container_app_name }}
        run: |
          RG="${RESOURCE_GROUP_NAME}"
          CAE_ID="${CONTAINER_APP_ENVIRONMENT_ID}"
          PE_PREFIX="${PRIVATE_ENDPOINT_SUBNET_PREFIX}"
          WEB_APP="${WEB_CONTAINER_APP_NAME}"
          API_APP="${WEB_APP/-ca-web/-ca-api}"
          IDENTITY_ID=$(terraform output -raw managed_identity_id)
          CLIENT_ID=$(terraform output -raw managed_identity_client_id)
          DNS="failed"
          INFER="failed"
          record() {
            printf 'ai_path_checks={"foundry_private_dns_validation":"%s","foundry_managed_identity_inference":"%s"}\n' "$DNS" "$INFER" >> "$GITHUB_OUTPUT"
            echo "AI Foundry path: private DNS = $DNS, managed-identity inference = $INFER"
            if [ "$DNS" != "passed" ] || [ "$INFER" != "passed" ]; then
              echo "::error::The AI Foundry path did not verify (private DNS = $DNS, inference = $INFER); the verify job will not report this deployment healthy."
            fi
          }
          # Test what the api is actually configured with, not the repository variables.
          api_env() {
            az containerapp show --name "$API_APP" --resource-group "$RG" \
              --query "properties.template.containers[0].env[?name=='$1'].value | [0]" -o tsv 2>/dev/null || echo ""
          }
          ENDPOINT=$(api_env AZURE_OPENAI_ENDPOINT)
          DEPLOYMENT=$(api_env AZURE_OPENAI_DEPLOYMENT)
          API_VERSION=$(api_env AZURE_OPENAI_API_VERSION)
          if [ -z "$ENDPOINT" ] || [ -z "$DEPLOYMENT" ] || [ -z "$API_VERSION" ]; then
            echo "::error::$API_APP carries no AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_DEPLOYMENT / AZURE_OPENAI_API_VERSION although ai_mode is saas."
            record
            exit 0
          fi

          JOB="job-aiprobe-${{ github.run_id }}"
          PROBE_B64=$(base64 -w0 "$GITHUB_WORKSPACE/scripts/ci/probe_foundry_path.py")
          # Built line-by-line like the migration probe: a heredoc would inherit
          # this run block's indentation into the manifest's top-level keys.
          JOB_YAML="$(mktemp)"
          {
            echo "identity:"
            echo "  type: UserAssigned"
            echo "  userAssignedIdentities:"
            echo "    \"${IDENTITY_ID}\": {}"
            echo "properties:"
            echo "  environmentId: \"${CAE_ID}\""
            echo "  configuration:"
            echo "    triggerType: Manual"
            echo "    replicaTimeout: 180"
            echo "    replicaRetryLimit: 0"
            echo "    manualTriggerConfig:"
            echo "      replicaCompletionCount: 1"
            echo "      parallelism: 1"
            echo "    registries:"
            echo "    - server: docker.io"
            echo "      username: \"${DOCKERHUB_USERNAME}\""
            echo "      passwordSecretRef: dockerhub-password"
            echo "    secrets:"
            echo "    - name: dockerhub-password"
            echo "      value: \"${DOCKERHUB_PASSWORD}\""
            echo "  template:"
            echo "    containers:"
            echo "    - image: \"${EFFECTIVE_API_IMAGE}\""
            echo "      name: \"${JOB}\""
            echo "      command:"
            echo "      - /bin/sh"
            echo "      args:"
            echo "      - -c"
            echo "      - 'echo \"\$PROBE_B64\" | base64 -d | python3 -'"
            echo "      env:"
            echo "      - name: PROBE_B64"
            echo "        value: \"${PROBE_B64}\""
            echo "      - name: AZURE_CLIENT_ID"
            echo "        value: \"${CLIENT_ID}\""
            echo "      - name: AZURE_OPENAI_ENDPOINT"
            echo "        value: \"${ENDPOINT}\""
            echo "      - name: AZURE_OPENAI_DEPLOYMENT"
            echo "        value: \"${DEPLOYMENT}\""
            echo "      - name: AZURE_OPENAI_API_VERSION"
            echo "        value: \"${API_VERSION}\""
            echo "      - name: CNA_PRIVATE_ENDPOINT_SUBNET_PREFIX"
            echo "        value: \"${PE_PREFIX}\""
            echo "      resources:"
            echo "        cpu: 0.5"
            echo "        memory: 1Gi"
          } > "$JOB_YAML"
          if ! az containerapp job create --name "$JOB" --resource-group "$RG" --yaml "$JOB_YAML" --only-show-errors > /dev/null; then
            rm -f "$JOB_YAML"
            echo "::error::Could not create the probe job $JOB."
            record
            exit 0
          fi
          rm -f "$JOB_YAML"
          az containerapp job start --name "$JOB" --resource-group "$RG" --only-show-errors > /dev/null || true

          STATUS="Running"
          for i in $(seq 1 24); do
            STATUS=$(az containerapp job execution list --name "$JOB" --resource-group "$RG" \
              --query "[-1].properties.status" -o tsv 2>/dev/null || echo "Running")
            case "$STATUS" in Succeeded|Failed|Stopped) break ;; esac
            sleep 10
          done
          echo "Probe job status: ${STATUS:-unknown}"
          if [ "$STATUS" = "Succeeded" ]; then
            # The script exits 0 only when both checks passed.
            DNS="passed"
            INFER="passed"
          else
            # Read the FOUNDRY_DNS= / FOUNDRY_INFERENCE= lines back from Log Analytics,
            # which ingests with a lag — retry for a few minutes. Whatever the log does
            # not confirm as passed stays failed.
            LAW_ID=$(az monitor log-analytics workspace list -g "$RG" --query '[0].customerId' -o tsv 2>/dev/null || echo "")
            LOG=""
            for i in $(seq 1 12); do
              [ -z "$LAW_ID" ] && break
              LOG=$(az monitor log-analytics query -w "$LAW_ID" \
                --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(15m) | where ContainerAppName_s == '${JOB}' | project Log_s" \
                -o tsv 2>/dev/null || echo "")
              if echo "$LOG" | grep -q 'FOUNDRY_INFERENCE='; then break; fi
              sleep 15
            done
            echo "--- probe output ---"
            echo "$LOG"
            echo "--- end of probe output ---"
            if echo "$LOG" | grep -q 'FOUNDRY_DNS=passed'; then DNS="passed"; fi
            if echo "$LOG" | grep -q 'FOUNDRY_INFERENCE=passed'; then INFER="passed"; fi
          fi
          az containerapp job delete --name "$JOB" --resource-group "$RG" --yes --only-show-errors > /dev/null 2>&1 || true
          record

      - name: Update apply evidence
        env:
          MANIFEST_PATH: ${{ github.workspace }}/.deployment-catalog/${{ inputs.environment }}/deployment-manifest.json
          AI_PATH_CHECKS: ${{ steps.ai_path.outputs.ai_path_checks }}
          FRONTDOOR_ENDPOINT_HOST_NAME: ${{ steps.export.outputs.frontdoor_endpoint_host_name }}
          FRONTDOOR_PROFILE_ID: ${{ steps.export.outputs.frontdoor_profile_id }}
          FRONTDOOR_ENDPOINT_ID: ${{ steps.export.outputs.frontdoor_endpoint_id }}
          FRONTDOOR_ORIGIN_GROUP_ID: ${{ steps.export.outputs.frontdoor_origin_group_id }}
          FRONTDOOR_ROUTE_ID: ${{ steps.export.outputs.frontdoor_route_id }}
          FRONTDOOR_CUSTOM_DOMAIN_ID: ${{ steps.export.outputs.frontdoor_custom_domain_id }}
          FRONTDOOR_SECRET_ID: ${{ steps.export.outputs.frontdoor_secret_id }}
          FRONTDOOR_PRIVATE_LINK_CONNECTION_IDS: ${{ steps.approve_private_link.outputs.approved_connection_ids }}
          CONTAINER_APP_ENVIRONMENT_ID: ${{ steps.export_ids.outputs.container_app_environment_id }}
          WEB_CONTAINER_APP_NAME: ${{ steps.export_ids.outputs.web_container_app_name }}
          PRIVATE_ENDPOINT_SUBNET_PREFIX: ${{ steps.export_ids.outputs.private_endpoint_subnet_prefix }}
          NEXTAUTH_URL: ${{ steps.export.outputs.nextauth_url }}
        run: python3 ${{ github.workspace }}/scripts/ci/update_apply_evidence.py

      - name: Upload staged manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: staged-deployment-manifest-${{ inputs.environment }}
          path: .deployment-catalog/${{ inputs.environment }}/deployment-manifest.json

      - name: Remove Runner IP from Key Vault
        if: always()
        env:
          VAR_KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          VAR_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
          VAR_TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
        run: |
          REGION_SHORT=${VAR_REGION_SHORT}
          if [[ -n "$VAR_TFSTATE_RESOURCE_GROUP" && "$VAR_TFSTATE_RESOURCE_GROUP" == *-tfstate ]]; then
            WORKLOAD_RG="$VAR_TFSTATE_RESOURCE_GROUP"
            WORKLOAD_RG="${WORKLOAD_RG%-tfstate}"
          else
            WORKLOAD_RG="rg-cna-${ENVIRONMENT}-${REGION_SHORT}"
          fi
          # Trust the Terraform-maintained KEY_VAULT_NAME variable (the real name
          # carries a suffix), but only if it matches THIS environment's prefix —
          # the variable is repo-level and both env workloads write it (last
          # apply wins). Bare "-kv" is the pre-first-apply fallback.
          KEY_VAULT_NAME="$VAR_KEY_VAULT_NAME"
          if [[ "$KEY_VAULT_NAME" != "${WORKLOAD_RG#rg-}-kv"* ]]; then
            # Variable missing or belongs to the other environment — resolve the
            # real vault (name carries a suffix, e.g. -kv2) from Azure instead of
            # guessing.
            KEY_VAULT_NAME=$(az keyvault list -g "$WORKLOAD_RG" --query "[?starts_with(name, '${WORKLOAD_RG#rg-}-kv')].name | [0]" -o tsv 2>/dev/null || echo "")
            KEY_VAULT_NAME="${KEY_VAULT_NAME:-${WORKLOAD_RG#rg-}-kv}"
          fi
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [[ -n "$RUNNER_IP" ]]; then
            az keyvault network-rule remove --name "$KEY_VAULT_NAME" --resource-group "$WORKLOAD_RG" --ip-address "$RUNNER_IP" --only-show-errors >/dev/null 2>&1 || true
          fi

      - name: Remove Runner IP from storage account
        if: always()
        working-directory: infra/terraform/environments/${{ inputs.environment }}/workload
        run: |
          NAME="${STORAGE_ACCOUNT_NAME:-}"
          RG="${STORAGE_ACCOUNT_RG:-}"
          if [ -z "$NAME" ]; then
            # First apply of an environment: the account was created during this
            # run with the runner IP baked into ip_rules — resolve it from state.
            NAME=$(terraform output -raw storage_account_name 2>/dev/null || echo "")
            if [ -n "$NAME" ]; then
              RG=$(az storage account show --name "$NAME" --query resourceGroup -o tsv --only-show-errors 2>/dev/null || echo "")
            fi
          fi
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [ -n "$NAME" ] && [ -n "$RG" ] && [ -n "$RUNNER_IP" ]; then
            az storage account network-rule remove --account-name "$NAME" --resource-group "$RG" --ip-address "$RUNNER_IP" --only-show-errors >/dev/null 2>&1 || true
          fi

  verify:
    if: inputs.environment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: apply
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # $GITHUB_ENV does not cross jobs. WORKLOAD_RG / WORKLOAD_NAME_PREFIX are set in
      # the apply job but are NOT available here in verify, so the health-query step
      # below built a malformed metric URL and failed under `set -e`. Re-derive them
      # for this job using the same logic the other jobs use.
      - name: Derive workload names
        env:
          VAR_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
          VAR_TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
        run: |
          REGION_SHORT="$VAR_REGION_SHORT"
          if [[ -n "$VAR_TFSTATE_RESOURCE_GROUP" && "$VAR_TFSTATE_RESOURCE_GROUP" == *-tfstate ]]; then
            WORKLOAD_RG="$VAR_TFSTATE_RESOURCE_GROUP"
            WORKLOAD_RG="${WORKLOAD_RG%-tfstate}"
          else
            WORKLOAD_RG="rg-cna-${ENVIRONMENT}-${REGION_SHORT}"
          fi
          echo "WORKLOAD_RG=$WORKLOAD_RG" >> "$GITHUB_ENV"
          echo "WORKLOAD_NAME_PREFIX=${WORKLOAD_RG#rg-}" >> "$GITHUB_ENV"

      - name: Download staged manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: staged-deployment-manifest-${{ inputs.environment }}
          path: .deployment-catalog/${{ inputs.environment }}

      - name: Download policy gate report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: policy-gates-${{ inputs.environment }}
          path: .verification/${{ inputs.environment }}

      - name: Wait for Container Apps to stabilize
        run: |
          MANIFEST=".deployment-catalog/${ENVIRONMENT}/deployment-manifest.json"
          AFD_HOST=$(python3 -c "import json; d=json.load(open('$MANIFEST')); print(d['platform_context']['frontdoor_endpoint_host_name'])")
          echo "AFD endpoint: $AFD_HOST"

          echo "Polling https://$AFD_HOST/ until the app is reachable..."
          MAX_ATTEMPTS=20
          ATTEMPT=0
          REACHABLE=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$AFD_HOST/" || echo "000")
            echo "  Attempt $ATTEMPT/$MAX_ATTEMPTS — HTTP $HTTP_CODE"
            # 200/302/307 = success/redirect; 401/403 = auth wall (app is up); 404/503 = not ready
            if [[ "$HTTP_CODE" =~ ^(200|302|307|401|403)$ ]]; then
              echo "App reachable (HTTP $HTTP_CODE) — proceeding"
              REACHABLE=1
              break
            fi
            sleep 15
          done

          if [ $REACHABLE -eq 0 ]; then
            echo "App not reachable after $((MAX_ATTEMPTS * 15))s — waiting 5 extra minutes as fallback"
            sleep 300
          else
            echo "Waiting 2 minutes for Azure Monitor metrics to propagate..."
            sleep 120
          fi

      - name: Query Azure Monitor health directly
        run: |
          mkdir -p .verification/${ENVIRONMENT}
          METRIC_URL="https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$WORKLOAD_RG/providers/Microsoft.Cdn/profiles/$WORKLOAD_NAME_PREFIX-afd/providers/Microsoft.Insights/metrics?metricnames=OriginHealthPercentage&api-version=2023-10-01"
          THRESHOLD="${AZURE_MONITOR_HEALTH_THRESHOLD:-95}"
          VDIR=".verification/${ENVIRONMENT}"
          MAX_WAIT=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_WAIT ]; do
            ATTEMPT=$((ATTEMPT + 1))
            # `|| true`: under `set -e`, a non-zero az rest (transient error, or the
            # metric not yet emitted) would otherwise kill the step on attempt 1 and
            # defeat the retry loop. Let the loop retry; the python parse tolerates a
            # non-JSON/error body by yielding 0.0.
            az rest --method get --url "$METRIC_URL" > "$VDIR/external-health.json" 2>&1 || true
            HEALTH=$(python3 -c "import json; d=json.load(open('$VDIR/external-health.json')); v=d.get('value',[]); ts=(v[0].get('timeseries',[{}]) if v else [{}]); data=(ts[0].get('data',[]) if ts else []); pts=[p.get('average',0) for p in data if p.get('average') is not None]; print(f'{pts[-1]:.1f}' if pts else '0.0')" 2>/dev/null || echo "0.0")
            echo "  Attempt $ATTEMPT/$MAX_WAIT — OriginHealthPercentage: ${HEALTH}% (threshold: ${THRESHOLD}%)"
            if awk "BEGIN{exit !($HEALTH >= $THRESHOLD)}"; then
              echo "Origin health at ${HEALTH}% — threshold met"
              break
            fi
            [ $ATTEMPT -lt $MAX_WAIT ] && sleep 30 || echo "Origin health still at ${HEALTH}% after $((MAX_WAIT * 30))s — writing last value"
          done

      - name: Query Application Insights telemetry directly
        # NON-BLOCKING (temporary) — see docs/non-blocking-ci-steps.md #5, issue #100.
        # App Insights was removed; the `if` guard already skips this when the var is
        # unset, so it is effectively a no-op. Delete this step entirely as part of #100.
        if: vars.APPLICATION_INSIGHTS_NAME != 'none' && vars.APPLICATION_INSIGHTS_NAME != ''
        continue-on-error: true
        env:
          VAR_APPLICATION_INSIGHTS_NAME: ${{ vars.APPLICATION_INSIGHTS_NAME }}
        run: |
          az monitor app-insights query \
            --app "$VAR_APPLICATION_INSIGHTS_NAME" \
            --resource-group "$WORKLOAD_RG" \
            --analytics-query "requests | summarize successRate = todouble(sum(itemCount * iif(success == true, 1, 0))) / todouble(sum(itemCount))" \
            > .verification/${ENVIRONMENT}/canary-telemetry.json \
            || echo "App Insights query skipped — no telemetry data yet (fresh deploy)"

      - name: Execute progressive Front Door promotion actions
        run: |
          az afd route show \
            --ids "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$WORKLOAD_RG/providers/Microsoft.Cdn/profiles/$WORKLOAD_NAME_PREFIX-afd/afdEndpoints/$WORKLOAD_NAME_PREFIX-afd-ep/routes/$WORKLOAD_NAME_PREFIX-afd-route" \
            > .verification/${ENVIRONMENT}/staged-promotion.json

      - name: Query certificate monitoring and trigger renewal workflow
        if: vars.KEY_VAULT_NAME != 'none' && vars.KEY_VAULT_NAME != '' && vars.FRONTDOOR_CERTIFICATE_NAME != '' && vars.FRONTDOOR_CERTIFICATE_NAME != 'none'
        env:
          VAR_FRONTDOOR_CERTIFICATE_NAME: ${{ vars.FRONTDOOR_CERTIFICATE_NAME }}
          VAR_KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
        run: |
          az keyvault certificate show \
            --vault-name "$VAR_KEY_VAULT_NAME" \
            --name "$VAR_FRONTDOOR_CERTIFICATE_NAME" \
            > .verification/${ENVIRONMENT}/certificate-monitoring.json
          az keyvault certificate pending show \
            --vault-name "$VAR_KEY_VAULT_NAME" \
            --name "$VAR_FRONTDOOR_CERTIFICATE_NAME" \
            > .verification/${ENVIRONMENT}/certificate-renewal-status.json || true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Evaluate evidence and update manifest
        env:
          MANIFEST_PATH: .deployment-catalog/${{ inputs.environment }}/deployment-manifest.json
          VERIFICATION_DIR: .verification/${{ inputs.environment }}
          AZURE_MONITOR_HEALTH_THRESHOLD: ${{ env.AZURE_MONITOR_HEALTH_THRESHOLD }}
          APP_INSIGHTS_SUCCESS_THRESHOLD: ${{ env.APP_INSIGHTS_SUCCESS_THRESHOLD }}
          CERTIFICATE_EXPIRY_DAYS_THRESHOLD: ${{ env.CERTIFICATE_EXPIRY_DAYS_THRESHOLD }}
          CANARY_WEIGHT_PERCENT: ${{ env.CANARY_WEIGHT_PERCENT }}
          PRIMARY_WEIGHT_PERCENT: ${{ env.PRIMARY_WEIGHT_PERCENT }}
        run: python3 scripts/ci/evaluate_deployment_evidence.py

      - name: Persist release catalog entry
        run: |
          cp .deployment-catalog/${ENVIRONMENT}/deployment-manifest.json \
            .deployment-catalog/${ENVIRONMENT}/${{ github.run_id }}.json
          cp .deployment-catalog/${ENVIRONMENT}/deployment-manifest.json \
            .deployment-catalog/${ENVIRONMENT}/latest.json

      - name: Commit release catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment-catalog/${ENVIRONMENT}
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(release-catalog): add progressive rollout and renewal verification for ${ENVIRONMENT} run ${{ github.run_id }}"
          # Another run may push to main concurrently; rebase-and-push with retries
          # so a transient non-fast-forward doesn't drop the release-catalog entry
          # (which future rollbacks depend on). Fail loudly if it never lands.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "Release catalog pushed (attempt $attempt)"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed (likely concurrent update); retrying"
            git rebase --abort 2>/dev/null || true
            sleep $(( attempt * 5 ))
          done
          echo "::error::Failed to push release catalog after 5 attempts. The deploy succeeded but the rollback manifest was not persisted to main."
          exit 1

      - name: Upload deployment provenance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deployment-provenance-${{ inputs.environment }}-${{ github.run_id }}
          path: .deployment-catalog/${{ inputs.environment }}/${{ github.run_id }}.json
