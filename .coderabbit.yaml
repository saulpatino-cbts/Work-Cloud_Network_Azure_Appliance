# CodeRabbit configuration — Cloud Network Azure Appliance
# https://docs.coderabbit.ai/guides/configure-coderabbit
#
# This is the Azure appliance: Terraform + deploy/operate workflows. The two
# appliances are meant to be identical except cloud-specific parts, so the key
# review concern is: is this change shared-surface, and if so is the AWS sibling
# (and the core, for contract changes) notified? See CLAUDE.md "Cross-repo
# change notification".
language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "infra/terraform/**"
      instructions: >
        Azure Terraform. No hardcoded values at a call site — locations,
        endpoints and subscription ids are variables resolved at runtime;
        variables a human must supply take no default. All changes to module
        bodies / OIDC login / state backend / Key Vault / Azure OpenAI wiring /
        blob publish are cloud-specific and stay in this repo; anything else is
        shared-surface and the AWS sibling must be notified.
    - path: ".github/workflows/**"
      instructions: >
        Every GitHub Action must be pinned to a full commit SHA, never a tag.
        Secrets travel as TF_VAR_* env, never -var on a command line, never a
        workflow_dispatch input. Workflow numbers are stable across all three
        repos — never renumber. A workflow edit is almost always SHARED-SURFACE:
        flag that the AWS sibling needs the same change and a
        .reports/change-reports/ handover note. The drift workflows (350/360)
        must fail on a terraform plan error (exit 1), never read it as "no
        drift"; the Checkov gate must record the real scan result, not a
        hardcoded "passed".
    - path: "scripts/ci/**"
      instructions: >
        These CI helper scripts are shared byte-for-byte with the AWS appliance.
        Any change here MUST be mirrored to the sibling and a handover note
        written. Flag divergence.
  tools:
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true

chat:
  auto_reply: true
